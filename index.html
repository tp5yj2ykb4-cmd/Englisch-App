<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fafaf9">
<link rel="apple-touch-icon" href="icon.png">

<title>English Trainer</title>
<style>
:root{
  --bg:#fafaf9; --panel:#ffffff; --panel2:#e7e5e4; --line:#d6d3d1;
  --txt:#292524; --dim:#57534e; --faint:#78716c;
  --amber:#f59e0b; --amber2:#b45309; --green:#059669; --red:#e11d48;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto}
header{display:flex; justify-content:space-between; align-items:center;
  padding:14px 16px 10px; border-bottom:1px solid var(--panel2)}
h1{font-family:Georgia,'Times New Roman',serif; font-size:20px; margin:0; color:#1c1917}
.sub{font-family:ui-monospace,Menlo,monospace; font-size:10px; letter-spacing:.12em; color:var(--faint); margin-top:3px}
.pill{display:flex; align-items:center; gap:6px; background:var(--panel); border:1px solid var(--panel2); border-radius:999px;
  padding:6px 12px; font-family:ui-monospace,monospace; font-size:12px}
main{flex:1; overflow-y:auto; padding:18px 16px 24px; -webkit-overflow-scrolling:touch}
nav{display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--panel2);
  padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none; border:none; color:var(--faint); padding:10px 0 12px;
  font-family:ui-monospace,monospace; font-size:10px; letter-spacing:.06em; cursor:pointer}
nav button.on{color:var(--amber2)}
nav button .ic{font-size:18px; display:block; margin-bottom:3px}
.btn{display:block; width:100%; border:none; border-radius:14px; padding:14px;
  font-size:15px; font-weight:600; cursor:pointer; margin-top:10px}
.btn.primary{background:var(--amber); color:#1c1917}
.btn.ghost{background:var(--panel2); color:var(--txt)}
.btn.good{background:var(--green); color:#ffffff}
.btn.bad{background:var(--panel2); color:var(--red); border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px}
.chip{flex:0 0 auto; border:none; border-radius:999px; padding:7px 13px; cursor:pointer;
  font-family:ui-monospace,monospace; font-size:12px; background:var(--panel2); color:var(--dim)}
.chip.on{background:var(--amber); color:#1c1917}
.rail{display:flex; align-items:flex-end; gap:5px; margin:14px 0 4px}
.drawer{width:30px}
.drawer .box{height:40px; border:1px solid var(--line); border-radius:6px;
  background:var(--panel); position:relative; overflow:hidden}
.drawer .fill{position:absolute; left:0; right:0; bottom:0; background:rgba(245,158,11,.5); transition:height .4s}
.drawer .n{display:block; text-align:center; font-family:ui-monospace,monospace;
  font-size:10px; color:var(--faint); margin-top:3px}
.drawer.new .box{border-style:dashed; background:transparent}
.sep{width:1px; height:40px; background:var(--panel2); margin:0 4px}
.meta{font-family:ui-monospace,monospace; font-size:11px; color:var(--faint); margin:12px 0 8px}
.flip{perspective:1200px; height:230px; margin-top:6px}
.flip .inner{position:relative; width:100%; height:100%; transition:transform .45s; transform-style:preserve-3d; cursor:pointer}
.flip.turned .inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:18px; border:1px solid var(--line); background:var(--panel); padding:22px;
  box-shadow:0 1px 3px rgba(28,25,23,.08)}
.face.back{transform:rotateY(180deg); border-color:rgba(245,158,11,.5)}
.word{font-family:Georgia,serif; font-size:34px; text-align:center; line-height:1.2; color:#1c1917}
.face.back .word{font-size:28px; color:var(--amber2)}
.hint{position:absolute; bottom:12px; font-family:ui-monospace,monospace; font-size:10px; color:var(--faint)}
.spk{margin-top:16px; border:none; background:var(--panel2); color:var(--amber2);
  border-radius:999px; width:46px; height:46px; font-size:20px; cursor:pointer}
.card{background:var(--panel); border:1px solid var(--panel2); border-radius:16px; padding:16px; margin-top:12px; box-shadow:0 1px 2px rgba(28,25,23,.06)}
.card h3{font-family:Georgia,serif; font-weight:normal; font-size:22px; margin:0; color:#1c1917}
input[type=text], select, textarea{width:100%; background:var(--bg); border:1px solid var(--line);
  border-radius:10px; padding:10px 12px; color:var(--txt); font-size:15px; margin-top:8px}
input.ok{border-color:var(--green)} input.no{border-color:var(--red)}
.why{font-size:12px; color:var(--dim); margin:6px 0 0}
.why b{color:var(--green); font-weight:600}
.rules{border:1px solid rgba(245,158,11,.4); border-radius:14px; background:var(--panel); padding:14px 16px; margin-top:12px}
.rules div{display:flex; gap:10px; font-size:14px; color:var(--dim); margin:6px 0}
.rules span{color:var(--amber2); font-family:ui-monospace,monospace}
.list button{display:flex; width:100%; justify-content:space-between; align-items:center;
  background:var(--panel); border:1px solid var(--panel2); border-radius:14px;
  padding:14px 16px; margin-top:10px; color:var(--txt); cursor:pointer}
.list .t{font-family:Georgia,serif; font-size:17px}
.banner{background:#ffe4e6; color:#9f1239; font-size:12px; padding:8px 16px; border:none; width:100%; text-align:left; cursor:pointer}
.msg{border-radius:16px; padding:11px 14px; margin-top:10px; max-width:85%; font-size:15px; line-height:1.4}
.msg.me{background:var(--amber); color:#1c1917; margin-left:auto; border-bottom-right-radius:4px}
.msg.ol{background:var(--panel); border:1px solid var(--panel2); border-bottom-left-radius:4px}
.corr{border-left:2px solid var(--red); background:var(--panel); font-size:12px;
  color:var(--dim); padding:7px 10px; border-radius:10px; margin-top:10px; max-width:85%}
.target{font-family:Georgia,serif; font-size:23px; line-height:1.4; color:#1c1917}
.target .hit{color:var(--green)} .target .miss{color:var(--red); text-decoration:underline}
.score{font-family:Georgia,serif; font-size:40px; color:var(--amber2); text-align:center}
.overlay{position:fixed; inset:0; background:rgba(250,250,249,.98); z-index:20; display:none;
  flex-direction:column; padding:16px; max-width:520px; margin:0 auto}
.overlay.show{display:flex}
.overlay .body{flex:1; overflow-y:auto}
.x{background:var(--panel2); border:none; color:var(--txt); border-radius:10px;
  width:36px; height:36px; font-size:16px; cursor:pointer}
.small{font-size:13px; color:var(--dim); margin:14px 0 4px}
.mono{font-family:ui-monospace,monospace; font-size:10px; color:var(--dim)}
.center{text-align:center}
label.small{display:block}
</style>
</head>
<body>
<div id="app">
  <header>
    <div><h1>English Trainer</h1><div class="sub" id="subline"></div></div>
    <div style="display:flex; gap:8px; align-items:center">
      <button class="x" onclick="openBackup()" title="Sicherung">&#8681;</button>
      <div class="pill">&#128293; <span id="streak">0</span></div>
    </div>
  </header>
  <button class="banner" id="banner" style="display:none" onclick="openBackup()"></button>
  <main id="main"></main>
  <nav>
    <button data-tab="vocab" class="on" onclick="go('vocab')"><span class="ic">&#9634;</span>Karten</button>
    <button data-tab="grammar" onclick="go('grammar')"><span class="ic">&#182;</span>Grammatik</button>
    <button data-tab="speak" onclick="go('speak')"><span class="ic">&#127908;</span>Sprechen</button>
    <button data-tab="chat" onclick="go('chat')"><span class="ic">&#9993;</span>Chat</button>
  </nav>
</div>

<div class="overlay" id="backup">
  <div style="display:flex; justify-content:space-between; align-items:center">
    <h1 style="font-family:Georgia,serif">Sicherung &amp; Einstellungen</h1>
    <button class="x" onclick="closeBackup()">&#10005;</button>
  </div>
  <div class="body">
    <p class="mono" id="saveinfo" style="margin-top:10px"></p>
    <p class="small">Kurzcode (kompatibel mit der Claude-Version):</p>
    <textarea id="exportbox" readonly rows="4" class="mono" onclick="this.select()"></textarea>
    <button class="btn ghost" onclick="copyExport()">In die Zwischenablage</button>
    <p class="small">Kurzcode einspielen:</p>
    <textarea id="importbox" rows="3" class="mono" placeholder="Code hier einfügen"></textarea>
    <button class="btn primary" onclick="doImport()">Wiederherstellen</button>
    <p class="small">KI-Anbieter (für Chat, KI-Grammatik und neue Wörter; der Key bleibt nur auf diesem Gerät):</p>
    <select id="provbox" onchange="provChanged()">
      <option value="gemini">Google Gemini — kostenlos</option>
      <option value="anthropic">Anthropic Claude — bezahlt</option>
    </select>
    <p class="small" id="keyhint"></p>
    <input type="text" id="keybox" placeholder="API-Key">
    <button class="btn ghost" onclick="saveKey()">Key speichern &amp; testen</button>
    <p class="mono" id="notice" style="margin-top:12px"></p>
  </div>
</div>

/* ================= Zustand ================= */
let S={cards:{},extra:[],chat:[],stats:{streak:0,reviews:0,correct:0,lastDay:null}};
let storageOk=true, apiKey="", provider="gemini", gModel="";

function loadState(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){const o=JSON.parse(raw); S=Object.assign(S,o);}
    apiKey=localStorage.getItem(KEY+":key")||"";
    provider=localStorage.getItem(KEY+":prov")||(apiKey?"anthropic":"gemini");
    gModel=localStorage.getItem(KEY+":gmodel")||"";
    localStorage.setItem(KEY+":probe","1");
  }catch(e){
    storageOk=false;
    const b=document.getElementById("banner");
    b.style.display="block";
    b.textContent="Kein lokaler Speicher — diese Datei ist zum Hosten gedacht (Anleitung im Chat). Tippen für Sicherung.";
  }
}
let saveT=null;
function save(){
  if(!storageOk) return;
  clearTimeout(saveT);
  saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));
    document.getElementById("saveinfo").textContent="Automatisch gespeichert "+new Date().toLocaleTimeString("de-DE");
  }catch(e){}},300);
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden"&&storageOk){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}});

function packState(){
  const now=Date.now();
  return JSON.stringify({v:1,
    c:Object.entries(S.cards).map(([en,k])=>[en,k.box,Math.round((k.due-now)/3600000)]),
    x:S.extra.map(w=>[w.en,w.de,w.level]),
    s:[S.stats.streak,S.stats.reviews,S.stats.correct]});
}
function unpackState(t){
  const o=JSON.parse(t.trim());
  if(o&&o.cards) return o;
  if(!o||!o.v) return null;
  const now=Date.now(), cards={};
  (o.c||[]).forEach(([en,box,h])=>{cards[en]={box:box,due:now+h*3600000};});
  return {cards:cards, extra:(o.x||[]).map(([en,de,lv])=>({en:en,de:de,level:lv})), chat:[],
    stats:{streak:(o.s&&o.s[0])||0,reviews:(o.s&&o.s[1])||0,correct:(o.s&&o.s[2])||0,lastDay:null}};
}

async function askClaude(messages,system,maxTokens){
  if(!apiKey) throw new Error("Kein API-Key hinterlegt (Sicherung → Key)");
  if(provider==="gemini"){
    const payload=JSON.stringify({
      system_instruction:{parts:[{text:system}]},
      contents:messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
      generationConfig:{maxOutputTokens:Math.max(1024,maxTokens||800)}
    });
    const tryModel=async(model)=>{
      const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",
        {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},body:payload});
      if(!res.ok){
        let msg="Server antwortet mit "+res.status;
        try{const eb=await res.json();if(eb&&eb.error&&eb.error.message)msg=eb.error.message;}catch(_e){}
        const err=new Error(msg);err.code=res.status;throw err;
      }
      const d=await res.json();
      const c=d.candidates&&d.candidates[0];
      const txt=((c&&c.content&&c.content.parts)||[]).map(p=>p.text||"").join("\n");
      if(!txt) throw new Error("leere Antwort (Tageslimit erreicht?)");
      return txt;
    };
    const remember=(m)=>{gModel=m;try{localStorage.setItem(KEY+":gmodel",m);}catch(_e){}};
    const modelGone=(e)=>e.code===404||/not (available|found|supported)|deprecated|no longer|does not exist/i.test(e.message||"");
    const cands=[...new Set([gModel,"gemini-flash-latest","gemini-3.7-flash","gemini-3.6-flash",
      "gemini-flash-lite-latest","gemini-2.5-flash-lite","gemini-2.5-flash"].filter(Boolean))];
    const overloaded=(e)=>e.code===503||e.code===429||/high demand|overloaded|try again|temporar|unavailable|resource.?exhaust|quota/i.test(e.message||"");
    let lastErr=null, sawOverload=false;
    for(const m of cands){
      try{const t=await tryModel(m);remember(m);return t;}
      catch(e){
        if(modelGone(e)){lastErr=lastErr||e;continue;}
        if(overloaded(e)){sawOverload=true;lastErr=e;continue;}
        throw e;
      }
    }
    if(sawOverload){
      // kurz durchatmen, dann ein zweiter Durchlauf — Lastspitzen sind oft nach Sekunden vorbei
      await new Promise(r=>setTimeout(r,2500));
      for(const m of cands){
        try{const t=await tryModel(m);remember(m);return t;}
        catch(e){lastErr=e;}
      }
      throw new Error("Google meldet Überlastung („high demand“) auf allen Gratis-Modellen. Das liegt nicht an deinem Key — eine Minute warten und nochmal versuchen.");
    }
    // Letzter Ausweg: Google nach der aktuellen Modellliste fragen
    try{
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",
        {headers:{"x-goog-api-key":apiKey}});
      const d=await r.json();
      const pick=((d.models)||[])
        .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
        .map(m=>String(m.name||"").replace("models/",""))
        .filter(n=>n.includes("flash")&&!/image|live|tts|audio|embed|veo|imagen|thinking/.test(n))
        .sort().reverse()[0];
      if(pick){const t=await tryModel(pick);remember(pick);return t;}
    }catch(_e){}
    throw lastErr||new Error("kein Gemini-Modell verfügbar");
  }
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json","x-api-key":apiKey,
      "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:maxTokens||800,system:system,messages:messages})});
  if(!res.ok){
    let msg="Server antwortet mit "+res.status;
    try{const eb=await res.json();if(eb&&eb.error&&eb.error.message)msg=eb.error.message;}catch(_e){}
    throw new Error(msg);
  }
  const d=await res.json();
  return d.content.filter(c=>c.type==="text").map(c=>c.text).join("\n");
}
function parseJSON(text){
  const c=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const st=[c.indexOf("{"),c.indexOf("[")].filter(i=>i>=0);
  if(!st.length) throw new Error("kein JSON");
  const b=c.slice(Math.min(...st));
  const last=Math.max(b.lastIndexOf("}"),b.lastIndexOf("]"));
  try{return JSON.parse(b.slice(0,last+1));}catch(e){}
  const objs=[];let d=0,s0=-1,inS=false,escp=false;
  for(let i=0;i<b.length;i++){const ch=b[i];
    if(inS){if(escp)escp=false;else if(ch==="\\")escp=true;else if(ch==='"')inS=false;continue;}
    if(ch==='"'){inS=true;continue;}
    if(ch==="{"){if(d===0)s0=i;d++;}
    else if(ch==="}"){d--;if(d===0&&s0>=0){try{objs.push(JSON.parse(b.slice(s0,i+1)));}catch(e){}s0=-1;}}}
  if(objs.length===1)return objs[0];
  if(objs.length)return objs;
  throw new Error("Antwort unvollständig");
}

let V={level:"A1",reverse:false,queue:[],idx:0,flipped:false,right:0,wrong:0,loading:false,err:""};
function pool(){return V.level==="Alle"?allWords():allWords().filter(w=>w.level===V.level);}
function buildRound(){
  const now=Date.now(), p=pool();
  const due=shuffle(p.filter(w=>S.cards[w.en]&&S.cards[w.en].due<=now));
  const fresh=p.filter(w=>!S.cards[w.en]).slice(0,8);
  V.queue=shuffle(due.slice(0,Math.max(0,20-fresh.length)).concat(fresh));
  V.idx=0;V.flipped=false;V.right=0;V.wrong=0;
}
function grade(known){
  const w=V.queue[V.idx]; if(!w)return;
  const now=Date.now(), prev=S.cards[w.en]||{box:1};
  const box=known?Math.min(5,prev.box+1):1;
  S.cards[w.en]={box:box,due:now+INTERVALS[box]*DAY};
  const today=new Date().toDateString(), yest=new Date(Date.now()-DAY).toDateString();
  S.stats.reviews++; if(known)S.stats.correct++;
  S.stats.streak = S.stats.lastDay===today?S.stats.streak : (S.stats.lastDay===yest?S.stats.streak+1:1);
  S.stats.lastDay=today;
  if(known){V.right++;V.idx++;}
  else{V.wrong++;const q=V.queue;const c=q.splice(V.idx,1)[0];q.splice(Math.min(q.length,V.idx+3),0,c);}
  V.flipped=false; save(); render();
}
async function loadMore(){
  V.loading=true;V.err="";render();
  try{
    const lv=V.level==="Alle"?"B1":V.level;
    const known=allWords().filter(w=>w.level===lv).map(w=>w.en);
    const txt=await askClaude([{role:"user",content:"Level "+lv+". Bereits vorhanden: "+known.join(", ")+". Gib 20 NEUE englische Wörter dieses Levels (die nächsthäufigsten, keine aus der Liste)."}],
      'Vokabeln für einen deutschsprachigen Lerner. Antworte NUR mit JSON-Array: [{"en":"word","de":"Übersetzung","level":"'+lv+'"}]. Übersetzung max 3 Wörter.');
    const have=new Set(allWords().map(w=>w.en));
    parseJSON(txt).forEach(w=>{if(w&&w.en&&w.de&&!have.has(String(w.en).toLowerCase()))
      S.extra.push({en:String(w.en).toLowerCase(),de:String(w.de),level:lv});});
    save();
  }catch(e){V.err=e.message;}
  V.loading=false;buildRound();render();
}

  h+='<div class="rail"><div class="drawer new"><div class="box"></div><span class="n">'+unseen+'</span></div><div class="sep"></div>';

  h+='</div><button class="chip" onclick="V.reverse=!V.reverse;render()">'+(V.reverse?"DE → EN":"EN → DE")+'</button></div>';

  const w=V.queue[V.idx];
  if(!w){
    h+='<div class="card center"><h3>Runde fertig</h3><p class="mono" style="margin-top:8px">'+V.right+' gewusst · '+V.wrong+' wiederholt</p>';
    h+='<button class="btn primary" onclick="buildRound();render()">Nächste Runde</button>';
    h+='<button class="btn ghost" onclick="loadMore()"'+(V.loading?" disabled":"")+'>'+(V.loading?"lädt …":"✦ 20 neue Wörter laden (KI)")+'</button>';
    if(V.err)h+='<p class="why" style="color:var(--red)">'+esc(V.err)+'</p>';
    h+='</div>';
  }else{
    const k=S.cards[w.en];
    h+='<p class="meta">Karte '+(V.idx+1)+' / '+V.queue.length+(k?" · Fach "+k.box:" · neu")+'</p>';
    const front=V.reverse?w.de:w.en, back=V.reverse?w.en:w.de;
    h+='<div class="flip'+(V.flipped?" turned":"")+'" onclick="V.flipped=!V.flipped;render()"><div class="inner">';
    h+='<div class="face"><div class="word">'+esc(front)+'</div>'+(!V.reverse?'<button class="spk" onclick="event.stopPropagation();speak(\''+w.en.replace(/'/g,"\\'")+'\')">&#128264;</button>':"")+'<span class="hint">tippen zum Umdrehen</span></div>';
    h+='<div class="face back"><div class="word">'+esc(back)+'</div>'+(V.reverse?'<button class="spk" onclick="event.stopPropagation();speak(\''+w.en.replace(/'/g,"\\'")+'\')">&#128264;</button>':"")+'</div>';
    h+='</div></div>';
    h+=V.flipped
      ?'<div class="row"><button class="btn bad" onclick="grade(false)">✕ Nochmal</button><button class="btn good" onclick="grade(true)">✓ Gewusst</button></div>'
      :'<button class="btn primary" onclick="V.flipped=true;render()">Antwort zeigen</button>';
  }
  $("main").innerHTML=h;
}

/* ================= Grammatik ================= */
let G={topic:null,items:[],rule:[],answers:{},checked:false,loading:false,err:""};
function isRight(it,val){return String(it.a).split("/").some(a=>norm(a)===norm(val||""));}
function openTopic(i){
  const t=GRAMMAR[i];
  G={topic:t.t,rule:t.r,items:shuffle(t.i).slice(0,6),answers:{},checked:false,loading:false,err:""};
  render();
}
function checkG(){
  G.items.forEach((it,i)=>{G.answers[i]=($("g"+i)||{}).value||"";});
  G.checked=true;render();
}
async function aiSet(){
  G.loading=true;G.err="";render();
  try{
    const txt=await askClaude([{role:"user",content:"Thema: "+G.topic}],
      'Englischlehrer für deutschsprachigen Lerner (B1). NUR JSON: {"items":[{"q":"Satz mit ___ (Hinweis)","a":"Lösung","w":"Erklärung deutsch, max 8 Wörter"}]} — genau 5 items. Mehrere Lösungen mit / trennen.');
    const raw=parseJSON(txt);
    const items=(Array.isArray(raw)?raw:raw.items||[]).filter(x=>x&&x.q&&x.a);
    if(!items.length)throw new Error("keine Aufgaben erhalten");
    G.items=items;G.answers={};G.checked=false;
  }catch(e){G.err=e.message;}
  G.loading=false;render();
}
function renderGrammar(){
  let h="";
  if(!G.topic){
    h='<p class="meta">THEMA WÄHLEN</p><div class="list">';
    GRAMMAR.forEach((t,i)=>{h+='<button onclick="openTopic('+i+')"><span class="t">'+esc(t.t)+'</span><span style="color:var(--faint)">›</span></button>';});
    h+='</div>';
  }else{
    h='<button class="chip" onclick="G.topic=null;render()">← alle Themen</button>';
    h+='<h1 style="font-family:Georgia,serif;margin:12px 0 0">'+esc(G.topic)+'</h1>';
    h+='<div class="rules">'+G.rule.map((r,i)=>'<div><span>'+(i+1)+'</span>'+esc(r)+'</div>').join("")+'</div>';
    G.items.forEach((it,i)=>{
      const ok=G.checked&&isRight(it,G.answers[i]);
      h+='<div class="card"><div style="font-size:15px">'+esc(it.q)+'</div>';
      h+='<input type="text" id="g'+i+'" value="'+esc(G.answers[i]||"")+'" placeholder="deine Antwort" class="'+(G.checked?(ok?"ok":"no"):"")+'"'+(G.checked?" readonly":"")+'>';
      if(G.checked&&!ok)h+='<p class="why"><b>'+esc(it.a)+'</b> — '+esc(it.w)+'</p>';
      h+='</div>';
    });
    if(G.checked){
      const score=G.items.filter((it,i)=>isRight(it,G.answers[i])).length;
      h+='<div class="card center"><div class="score">'+score+' / '+G.items.length+'</div>';
      h+='<button class="btn primary" onclick="openTopic('+GRAMMAR.findIndex(t=>t.t===G.topic)+')">Nochmal mischen</button>';
      h+='<button class="btn ghost" onclick="aiSet()"'+(G.loading?" disabled":"")+'>'+(G.loading?"lädt …":"✦ Neue Sätze (KI)")+'</button>';
      if(G.err)h+='<p class="why" style="color:var(--red)">'+esc(G.err)+'</p>';
      h+='</div>';
    }else{
      h+='<button class="btn primary" onclick="checkG()">Prüfen</button>';
    }
  }
  $("main").innerHTML=h;
}

/* ================= Spracherkennung ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recActive=false,recObj=null;
function record(cb,rerender){
  if(!SR)return;
  const rr=()=>{if(rerender)render();};
  if(recActive){try{recObj.stop();}catch(e){}recActive=false;rr();return;}
  recObj=new SR();recObj.lang="en-GB";recObj.interimResults=false;recObj.maxAlternatives=1;
  recObj.onresult=e=>{cb(e.results[0][0].transcript);};
  recObj.onend=()=>{recActive=false;rr();};
  recObj.onerror=()=>{recActive=false;rr();};
  try{recObj.start();recActive=true;rr();}catch(e){recActive=false;}
}

/* ================= Sprechen ================= */
let P={bank:SPEAK_SEED,i:0,said:"",typed:"",loading:false};
function alignWords(target,said){
  const t=norm(target).split(" ").filter(Boolean), s=norm(said).split(" ").filter(Boolean);
  const dp=Array.from({length:t.length+1},()=>new Array(s.length+1).fill(0));
  for(let i=1;i<=t.length;i++)for(let j=1;j<=s.length;j++)
    dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const m=new Set();let i=t.length,j=s.length;
  while(i>0&&j>0){if(t[i-1]===s[j-1]){m.add(i-1);i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
  return{words:t,m:m,score:t.length?Math.round(m.size/t.length*100):0};
}
async function moreSentences(){
  P.loading=true;render();
  try{
    const txt=await askClaude([{role:"user",content:"8 neue Sätze, Alltag und Büro gemischt."}],
      'NUR JSON-Array aus 8 englischen Sätzen (je 8–14 Wörter, britisch, B1): ["…"]');
    const arr=parseJSON(txt).filter(s=>typeof s==="string");
    if(arr.length){P.bank=arr;P.i=0;P.said="";P.typed="";}
  }catch(e){}
  P.loading=false;render();
}
function renderSpeak(){
  const target=P.bank[P.i%P.bank.length];
  const r=P.said?alignWords(target,P.said):null;
  let h='<p class="meta">NACHSPRECHEN · SATZ '+((P.i%P.bank.length)+1)+' / '+P.bank.length+'</p>';
  h+='<div class="card"><div class="target">';
  h+=r?r.words.map((w,k)=>'<span class="'+(r.m.has(k)?"hit":"miss")+'">'+esc(w)+' </span>').join("")
      :esc(target);
  h+='</div><button class="btn ghost" style="width:auto;padding:10px 16px" onclick="speak('+JSON.stringify(target).replace(/"/g,"&quot;")+')">&#9654; Vorsprechen lassen</button></div>';
  if(r)h+='<div class="card center"><div class="score">'+r.score+'%</div><p class="why">Verstanden: „'+esc(P.said)+'“</p></div>';
  if(SR){
    h+='<button class="btn '+(recActive?"bad":"primary")+'" onclick="P.said=\'\';record(t=>{P.said=t;render()},true)">'+(recActive?"&#127908; Höre zu … tippen zum Stoppen":"&#127908; Aufnehmen und nachsprechen")+'</button>';
  }else{
    h+='<div class="card"><p class="why">Mikrofon hier nicht verfügbar. Sprich laut und tippe den Satz aus dem Gedächtnis:</p>';
    h+='<input type="text" id="typedbox" value="'+esc(P.typed)+'" placeholder="Satz aus dem Gedächtnis">';
    h+='<button class="btn ghost" onclick="P.typed=$(\'typedbox\').value;P.said=P.typed;render()">Vergleichen</button></div>';
  }
  h+='<div class="row"><button class="btn ghost" onclick="P.i++;P.said=\'\';P.typed=\'\';render()">↻ Nächster Satz</button>';
  h+='<button class="btn ghost" onclick="moreSentences()"'+(P.loading?" disabled":"")+'>'+(P.loading?"lädt …":"✦ Neue Sätze (KI)")+'</button></div>';
  $("main").innerHTML=h;
}

/* ================= Chat ================= */
let C={loading:false,err:""};
async function sendChat(){
  const box=$("chatin"); const text=(box.value||"").trim();
  if(!text||C.loading)return;
  S.chat.push({role:"user",content:text}); box.value=""; C.loading=true;C.err=""; save(); render();
  try{
    const txt=await askClaude(S.chat.map(m=>({role:m.role,content:m.content})),
      'Du bist Oliver, 34, aus Manchester, lockerer Brieffreund. Der Nutzer lernt Englisch (B1). Antworte NUR mit JSON: {"correction":"…" oder null,"reply":"…"}. correction: max 2 Fehler der letzten Nachricht, deutsch, kurz, "falsch → richtig (Grund)". reply: Englisch, 2–4 Sätze, endet mit Frage.');
    const p=parseJSON(txt);
    S.chat.push({role:"assistant",content:p.reply,correction:p.correction||null});
    speak(p.reply); save();
  }catch(e){C.err=e.message;}
  C.loading=false;render();
  const m=$("main");m.scrollTop=m.scrollHeight;
}
function renderChat(){
  let h="";
  if(!apiKey){
    h+='<div class="card"><h3>Oliver braucht einen Schlüssel</h3><p class="why" style="margin-top:8px">Der Chat ruft eine KI auf. Hinterlege einmalig einen API-Key unter Sicherung — mit Google Gemini kostenlos, ohne Kreditkarte.</p><button class="btn primary" onclick="openBackup()">Zu den Einstellungen</button></div>';
    $("main").innerHTML=h; return;
  }
  if(!S.chat.length)h+='<div class="card"><h3>Oliver aus Manchester</h3><p class="why" style="margin-top:8px">Schreib ihm auf Englisch. Er korrigiert kurz und redet dann normal weiter.</p></div>';
  S.chat.forEach(m=>{
    if(m.role==="user")h+='<div class="msg me">'+esc(m.content)+'</div>';
    else{
      if(m.correction)h+='<div class="corr">'+esc(m.correction)+'</div>';
      h+='<div class="msg ol">'+esc(m.content)+' <button class="spk" style="width:30px;height:30px;font-size:14px;margin:0;vertical-align:middle" onclick="speak('+JSON.stringify(m.content).replace(/"/g,"&quot;")+')">&#128264;</button></div>';
    }
  });
  if(C.loading)h+='<p class="mono">Oliver tippt …</p>';
  if(C.err)h+='<p class="why" style="color:var(--red)">'+esc(C.err)+'</p>';
  h+='<div style="display:flex;gap:8px;margin-top:14px">';
  if(SR)h+='<button class="x" style="width:46px;height:46px" onclick="record(t=>{$(\'chatin\').value+=($(\'chatin\').value?\' \':\'\')+t})">&#127908;</button>';
  h+='<input type="text" id="chatin" placeholder="Write in English …" style="margin:0" onkeydown="if(event.key===\'Enter\')sendChat()">';
  h+='<button class="x" style="width:46px;height:46px;background:var(--amber);color:#1c1917" onclick="sendChat()">➤</button></div>';
  $("main").innerHTML=h;
}

/* ================= Sicherung ================= */
function openBackup(){$("exportbox").value=packState();$("keybox").value=apiKey;$("provbox").value=provider;provChanged();$("backup").classList.add("show");}
function closeBackup(){$("backup").classList.remove("show");}
function copyExport(){
  const t=packState();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(
    ()=>{$("notice").textContent="Kurzcode kopiert.";},
    ()=>{$("notice").textContent="Kopieren ging nicht — Feld antippen und alles markieren.";});}
  else{$("notice").textContent="Feld antippen und alles markieren.";}
}
function doImport(){
  try{
    const next=unpackState($("importbox").value);
    if(!next)throw new Error("leer");
    S=Object.assign({cards:{},extra:[],chat:[],stats:{streak:0,reviews:0,correct:0,lastDay:null}},next);
    save();$("importbox").value="";closeBackup();buildRound();render();
  }catch(e){$("notice").textContent="Code war unvollständig — bitte komplett einfügen.";}
}
function provChanged(){
  provider=$("provbox").value;
  try{localStorage.setItem(KEY+":prov",provider);}catch(e){}
  $("keybox").placeholder=provider==="gemini"?"AQ.… oder AIza…":"sk-ant-…";
  $("keyhint").textContent=provider==="gemini"
    ?"Kostenlosen Key holen: aistudio.google.com → „Get API key“. Ohne Kreditkarte. Hinweis: Im Gratis-Tarif darf Google Eingaben zum Verbessern seiner Modelle nutzen."
    :"Key holen: console.anthropic.com → API Keys. Braucht Guthaben, kostet Centbeträge pro Nutzung.";
}
async function saveKey(){
  apiKey=$("keybox").value.trim();
  provider=$("provbox").value;
  try{localStorage.setItem(KEY+":prov",provider);}catch(e){}
  try{localStorage.setItem(KEY+":key",apiKey);}catch(e){}
  if(!apiKey){$("notice").textContent="Key entfernt.";return;}
  $("notice").textContent="Key gespeichert — teste …";
  try{
    await askClaude([{role:"user",content:"OK?"}],"Antworte nur mit OK.",10);
    $("notice").textContent="✓ Key funktioniert"+(provider==="gemini"&&gModel?" (Modell: "+gModel+")":"")+" — Chat, KI-Grammatik und neue Wörter sind frei.";
  }catch(e){$("notice").textContent="Key gespeichert, aber Test fehlgeschlagen: "+e.message;}
}

/* ================= Start ================= */
loadState();buildRound();render();
if(storageOk)$("saveinfo").textContent="Automatisches Speichern aktiv";
</script>
