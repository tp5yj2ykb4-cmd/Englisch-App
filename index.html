<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" id="themecolor" content="#f7f5f1">
<script>
/* Gewählte Darstellung vor dem ersten Zeichnen setzen, sonst blitzt die App
   beim Start kurz hell auf, obwohl „Dunkel" eingestellt ist. */
try{var th=localStorage.getItem("et-standalone-v1:theme");if(th)document.documentElement.setAttribute("data-theme",th);}catch(e){}
</script>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="icon.png">
<title>English Trainer</title>
<style>
:root{
  --bg:#f7f5f1; --panel:#ffffff; --panel2:#efedea; --line:#dfdbd4;
  --txt:#1c1917; --dim:#57534e; --faint:#8b827a;
  --amber:#f59e0b; --amber2:#b45309; --amber-soft:#fef3c7;
  --green:#059669; --red:#e11d48;
  --indigo:#6366f1; --indigo-soft:#e0e7ff;
  --r-sm:12px; --r-md:16px; --r-lg:20px; --r-xl:28px;
  --sh-1:0 1px 3px rgba(28,25,23,.06), 0 4px 12px -4px rgba(28,25,23,.09);
  --sh-2:0 4px 8px rgba(28,25,23,.06), 0 20px 44px -16px rgba(28,25,23,.22);
  --ease:cubic-bezier(.22,.61,.36,1);
  --edge:rgba(28,25,23,.06); --glass:rgba(255,255,255,.84); --veil:rgba(250,249,247,.94);
  --glow1:#ffedc2; --glow2:#ffe1e6;
  --face:linear-gradient(168deg,#ffffff 0%,#fdfcfa 100%);
  --face-back:linear-gradient(168deg,#fffdf5 0%,#fef3c7 100%);
  --soft:linear-gradient(170deg,#fffdf6,#fffbeb);
  --banner-bg:linear-gradient(180deg,#fff1f2,#ffe4e6); --banner-txt:#9f1239;
  --toast-bg:#1c1917; --toast-txt:#fff; --raise:#ffffff;
  color-scheme:light;
}
/* Dunkel: einmal für „Automatisch" (folgt dem iPhone) und einmal für die
   feste Wahl in den Einstellungen. CSS kann einen Block nicht für beide
   Fälle teilen, deshalb steht er doppelt — Änderungen bitte in beiden. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#14110f; --panel:#1f1b18; --panel2:#2c2622; --line:#3d3631;
    --txt:#f5f0ea; --dim:#bdb2a8; --faint:#8c8178;
    --amber2:#fbbf24; --amber-soft:#3a2a12; --green:#34d399; --red:#fb7185;
    --sh-1:0 1px 2px rgba(0,0,0,.35), 0 4px 12px -4px rgba(0,0,0,.5);
    --sh-2:0 4px 8px rgba(0,0,0,.35), 0 20px 44px -16px rgba(0,0,0,.75);
    --edge:rgba(255,255,255,.07); --glass:rgba(27,23,20,.84); --veil:rgba(20,17,15,.95);
    --glow1:rgba(245,158,11,.16); --glow2:rgba(225,29,72,.11);
    --face:linear-gradient(168deg,#28231f 0%,#1f1b18 100%);
    --face-back:linear-gradient(168deg,#2e2416 0%,#3a2a12 100%);
    --soft:linear-gradient(170deg,#2a2218,#231c14);
    --banner-bg:linear-gradient(180deg,#3b1520,#2f1119); --banner-txt:#fecdd3;
    --toast-bg:#f5f0ea; --toast-txt:#1c1917; --raise:#3a332e;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14110f; --panel:#1f1b18; --panel2:#2c2622; --line:#3d3631;
  --txt:#f5f0ea; --dim:#bdb2a8; --faint:#8c8178;
  --amber2:#fbbf24; --amber-soft:#3a2a12; --green:#34d399; --red:#fb7185;
  --sh-1:0 1px 2px rgba(0,0,0,.35), 0 4px 12px -4px rgba(0,0,0,.5);
  --sh-2:0 4px 8px rgba(0,0,0,.35), 0 20px 44px -16px rgba(0,0,0,.75);
  --edge:rgba(255,255,255,.07); --glass:rgba(27,23,20,.84); --veil:rgba(20,17,15,.95);
  --glow1:rgba(245,158,11,.16); --glow2:rgba(225,29,72,.11);
  --face:linear-gradient(168deg,#28231f 0%,#1f1b18 100%);
  --face-back:linear-gradient(168deg,#2e2416 0%,#3a2a12 100%);
  --soft:linear-gradient(170deg,#2a2218,#231c14);
  --banner-bg:linear-gradient(180deg,#3b1520,#2f1119); --banner-txt:#fecdd3;
  --toast-bg:#f5f0ea; --toast-txt:#1c1917; --raise:#3a332e;
  color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--bg); color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums}
body{background-image:
  radial-gradient(120% 45% at 15% 0%, var(--glow1) 0%, transparent 60%),
  radial-gradient(90% 40% at 100% 8%, var(--glow2) 0%, transparent 60%);
  background-repeat:no-repeat}
#app{display:flex; flex-direction:column; height:100%; max-width:520px; margin:0 auto; position:relative}

/* Sprung ans Ende. Liegt im #app, damit er auf breiten Fenstern am rechten
   Rand der App klebt und nicht am Rand des Bildschirms. */
.tobottom{position:absolute; right:14px; z-index:8;
  bottom:calc(env(safe-area-inset-bottom, 0px) + 70px);
  width:44px; height:44px; border-radius:999px; border:1px solid var(--edge);
  background:var(--glass); color:var(--dim); font-size:17px; cursor:pointer;
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  box-shadow:var(--sh-2); display:none; align-items:center; justify-content:center;
  transition:transform .12s var(--ease)}
.tobottom.show{display:flex}
.tobottom:active{transform:scale(.9)}
.chatbar{display:flex; justify-content:space-between; align-items:center; gap:10px;
  margin-top:18px; padding-top:12px; border-top:1px solid var(--panel2)}
.linkbtn{background:none; border:none; padding:6px 2px; cursor:pointer;
  font-family:inherit; font-size:12.5px; font-weight:600; color:var(--red)}
.linkbtn:active{opacity:.55}

/* Kopf: Safe Area oben war vorher nicht berücksichtigt — im Home-Bildschirm-
   Modus lief der Titel sonst unter die Statusleiste. */
header{display:flex; justify-content:space-between; align-items:center; gap:12px;
  padding:calc(env(safe-area-inset-top, 0px) + 16px) 16px 14px}
h1{font-size:24px; font-weight:800; letter-spacing:-.035em; margin:0; color:var(--txt)}
h1 em{font-style:normal; background:linear-gradient(120deg,#f59e0b,#e11d48);
  -webkit-background-clip:text; background-clip:text; color:transparent}
.sub{font-size:12px; font-weight:500; color:var(--faint); margin-top:3px}
/* Serie als Knopf: führt direkt zu den Medaillen. */
.pill{display:flex; align-items:center; gap:5px; flex:0 0 auto; border:none; cursor:pointer;
  background:linear-gradient(135deg,#fbbf24,#f97316); border-radius:999px;
  padding:8px 14px 8px 11px; font-family:inherit; font-size:16px; font-weight:800;
  color:#fff; text-shadow:0 1px 2px rgba(154,52,18,.35);
  box-shadow:0 2px 4px rgba(194,65,12,.2), 0 8px 20px -6px rgba(249,115,22,.55);
  transition:transform .12s var(--ease)}
.pill:active{transform:scale(.94)}
.pill.cold{background:linear-gradient(135deg,#d6d3d1,#a8a29e); text-shadow:none;
  box-shadow:var(--sh-1)}
.pill .medn{font-size:12px; font-weight:700; opacity:.9; padding-left:7px; margin-left:2px;
  border-left:1px solid rgba(255,255,255,.4)}
main{flex:1; overflow-y:auto; padding:18px 16px 28px; -webkit-overflow-scrolling:touch;
  overscroll-behavior-y:contain}

/* Tableiste mit Pillen-Markierung statt nur Farbwechsel. */
nav{display:grid; grid-template-columns:repeat(5,1fr); gap:2px;
  border-top:1px solid var(--edge);
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  padding:6px 6px calc(env(safe-area-inset-bottom, 0px) + 6px)}
nav button{position:relative; background:none; border:none; color:var(--faint); border-radius:14px;
  padding:6px 0 5px; font-family:inherit; font-size:10.5px; font-weight:600; cursor:pointer;
  transition:color .22s var(--ease), transform .12s var(--ease)}
nav button:active{transform:scale(.92)}
/* Inaktive Emojis grau, das aktive in Farbe: wirkt ruhiger als fünf bunte Icons. */
nav button .ic{font-size:21px; display:block; margin-bottom:2px; filter:grayscale(1); opacity:.5;
  transition:filter .25s, opacity .25s, transform .25s var(--ease)}
nav button.on{color:var(--txt)}
nav button.on .ic{filter:none; opacity:1; transform:translateY(-1px) scale(1.1)}
nav button.on::after{content:""; position:absolute; top:-6px; left:50%; width:24px; height:3px;
  margin-left:-12px; border-radius:0 0 3px 3px; background:linear-gradient(90deg,#fbbf24,#f97316)}

.btn{display:block; width:100%; border:none; border-radius:var(--r-md); padding:15px;
  font-size:15px; font-weight:600; letter-spacing:-.01em; cursor:pointer; margin-top:10px;
  transition:transform .12s var(--ease), box-shadow .22s var(--ease), opacity .2s}
.btn:active{transform:scale(.985)}
.btn.primary{background:linear-gradient(135deg,#fbbf24,#f97316); color:#fff;
  text-shadow:0 1px 2px rgba(154,52,18,.3);
  box-shadow:0 1px 2px rgba(194,65,12,.22), 0 10px 22px -8px rgba(249,115,22,.6)}
.btn.ghost{background:var(--panel2); color:var(--txt)}
.btn.good{background:linear-gradient(180deg,#10b981,#059669); color:#fff;
  box-shadow:0 1px 2px rgba(5,150,105,.22), 0 8px 20px -8px rgba(5,150,105,.5)}
.btn.bad{background:var(--panel); color:var(--red); border:1px solid var(--line);
  box-shadow:var(--sh-1)}
.btn:disabled{opacity:.45; box-shadow:none}
.row{display:grid; grid-template-columns:1fr 1fr; gap:10px}

/* Segmentierte Umschaltung für Üben / Statistik / Wörter. */
.seg{display:flex; gap:3px; background:var(--panel2); border-radius:var(--r-md);
  padding:3px; margin-bottom:14px}
.seg button{flex:1; border:none; background:none; border-radius:13px; padding:9px 0;
  font-size:13px; font-weight:600; letter-spacing:-.01em; color:var(--dim); cursor:pointer;
  transition:background .22s var(--ease), color .22s var(--ease), box-shadow .22s var(--ease)}
.seg button.on{background:var(--raise); color:var(--txt); box-shadow:var(--sh-1)}
.seg button:active{transform:scale(.97)}

.chips{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; border:none; border-radius:999px; padding:8px 14px; cursor:pointer;
  font-family:ui-monospace,monospace; font-size:12px; font-weight:500;
  background:var(--panel2); color:var(--dim);
  transition:background .22s var(--ease), color .22s var(--ease), transform .12s var(--ease)}
.chip:active{transform:scale(.95)}
.chip.on{background:linear-gradient(135deg,#fbbf24,#f97316); color:#fff;
  box-shadow:0 1px 2px rgba(194,65,12,.2), 0 6px 14px -6px rgba(249,115,22,.55)}
.chip:disabled{opacity:.45; box-shadow:none}

.rail{display:flex; align-items:flex-end; gap:5px; margin:14px 0 4px}
.drawer{width:30px}
.drawer .box{height:44px; border:1px solid var(--line); border-radius:9px;
  background:var(--panel); position:relative; overflow:hidden; box-shadow:var(--sh-1)}
.drawer .fill{position:absolute; left:0; right:0; bottom:0; border-radius:8px 8px 0 0;
  background:linear-gradient(180deg,#fcd34d,#f59e0b); transition:height .45s var(--ease)}
.drawer .n{display:block; text-align:center; font-family:ui-monospace,monospace;
  font-size:10px; color:var(--faint); margin-top:4px}
.drawer.new .box{border-style:dashed; background:transparent; box-shadow:none}
.sep{width:1px; height:44px; background:var(--panel2); margin:0 4px}
.meta{font-family:ui-monospace,monospace; font-size:10.5px; letter-spacing:.06em;
  color:var(--faint); margin:14px 0 8px; text-transform:uppercase}

.flip{perspective:1400px; height:240px; margin-top:6px}
.flip .inner{position:relative; width:100%; height:100%;
  transition:transform .5s var(--ease); transform-style:preserve-3d; cursor:pointer}
.flip.turned .inner{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:var(--r-xl); border:1px solid var(--edge);
  background:var(--face); padding:24px;
  box-shadow:var(--sh-2)}
.face.back{transform:rotateY(180deg); border-color:rgba(245,158,11,.32);
  background:var(--face-back)}
.word{font-family:Georgia,serif; font-size:35px; text-align:center; line-height:1.18;
  letter-spacing:-.015em; color:var(--txt)}
.face.back .word{font-size:28px; color:var(--amber2)}
.hint{position:absolute; bottom:14px; font-family:ui-monospace,monospace;
  font-size:9.5px; letter-spacing:.08em; color:var(--faint); text-transform:uppercase}
.spk{margin-top:18px; border:1px solid rgba(245,158,11,.3);
  background:var(--soft); color:var(--amber2);
  border-radius:999px; width:48px; height:48px; font-size:20px; cursor:pointer;
  box-shadow:var(--sh-1); transition:transform .12s var(--ease), background .2s}
.spk:active{transform:scale(.9)}

.card{background:var(--panel); border:1px solid var(--edge);
  border-radius:var(--r-lg); padding:18px; margin-top:14px; box-shadow:var(--sh-1)}
.card h3{font-size:17px; font-weight:600; letter-spacing:-.02em; margin:0 0 2px; color:var(--txt)}

/* 16px verhindert, dass Safari beim Antippen ins Feld hineinzoomt. */
input[type=text], select, textarea{width:100%; background:var(--panel);
  border:1px solid var(--line); border-radius:var(--r-md); padding:13px 14px;
  color:var(--txt); font-size:16px; margin-top:9px; -webkit-appearance:none; appearance:none;
  font-family:inherit; transition:border-color .2s, box-shadow .2s}
select{background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),
  linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%, calc(100% - 14px) 50%;
  background-size:5px 5px, 5px 5px; background-repeat:no-repeat; padding-right:38px}
input[type=text]:focus, select:focus, textarea:focus{outline:none; border-color:var(--amber);
  box-shadow:0 0 0 3px rgba(245,158,11,.16)}
input.ok{border-color:var(--green)} input.no{border-color:var(--red)}
textarea{line-height:1.5}

.why{font-size:12.5px; line-height:1.5; color:var(--dim); margin:8px 0 0}
.why b{color:var(--green); font-weight:600}
.rules{border:1px solid rgba(245,158,11,.3); border-radius:var(--r-lg);
  background:var(--soft); padding:15px 17px; margin-top:14px}
.rules div{display:flex; gap:11px; font-size:14px; line-height:1.45; color:var(--dim); margin:7px 0}
.rules span{color:var(--amber2); font-family:ui-monospace,monospace; font-weight:600; flex:0 0 auto}

.list button{display:flex; width:100%; justify-content:space-between; align-items:center; gap:12px;
  background:var(--panel); border:1px solid var(--edge); border-radius:var(--r-lg);
  padding:15px 17px; margin-top:10px; color:var(--txt); cursor:pointer; text-align:left;
  box-shadow:var(--sh-1); transition:transform .12s var(--ease), box-shadow .22s var(--ease)}
.list button:active{transform:scale(.99); box-shadow:none}
.list .t{font-size:16px; font-weight:600; letter-spacing:-.015em}
.list button .t{display:block; margin-bottom:3px}

.banner{background:var(--banner-bg); color:var(--banner-txt); font-size:12px;
  line-height:1.45; padding:10px 16px; border:none; width:100%; text-align:left; cursor:pointer}

.msg{border-radius:var(--r-lg); padding:12px 15px; margin-top:10px; max-width:86%;
  font-size:15px; line-height:1.45}
.msg.me{background:linear-gradient(135deg,#fbbf24,#f97316); color:#fff;
  margin-left:auto; border-bottom-right-radius:6px;
  box-shadow:0 6px 16px -8px rgba(245,158,11,.6)}
.msg.ol{background:var(--panel); border:1px solid var(--edge);
  border-bottom-left-radius:6px; box-shadow:var(--sh-1)}
.corr{border-left:3px solid var(--red); background:var(--panel); font-size:12.5px; line-height:1.5;
  color:var(--dim); padding:9px 12px; border-radius:var(--r-sm); margin-top:10px; max-width:86%;
  box-shadow:var(--sh-1)}

.target{font-family:Georgia,serif; font-size:23px; line-height:1.45; letter-spacing:-.01em; color:var(--txt)}
.target .hit{color:var(--green)}
.target .miss{color:var(--red); text-decoration:underline; text-decoration-thickness:1.5px;
  text-underline-offset:3px}
.score{font-family:Georgia,serif; font-size:42px; letter-spacing:-.02em; color:var(--amber2); text-align:center}

.overlay{position:fixed; inset:0; background:var(--veil); z-index:20; display:none;
  -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px);
  flex-direction:column; max-width:520px; margin:0 auto;
  padding:calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px)}
.overlay.show{display:flex}
.overlay .body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch}
.x{background:var(--panel2); border:none; color:var(--txt); border-radius:var(--r-sm);
  width:38px; height:38px; font-size:16px; cursor:pointer; flex:0 0 auto;
  transition:transform .12s var(--ease), background .2s}
.x:active{transform:scale(.92)}
.small{font-size:13px; line-height:1.5; color:var(--dim); margin:16px 0 4px}
.mono{font-family:ui-monospace,monospace; font-size:10px; color:var(--dim)}
.center{text-align:center}
label.small{display:block}

.kv{display:flex; justify-content:space-between; align-items:baseline; gap:12px;
  font-size:14px; color:var(--dim); margin:10px 0 4px}
.kv b{font-family:ui-monospace,monospace; font-size:13px; color:var(--txt); flex:0 0 auto}
.bar{height:7px; background:var(--panel2); border-radius:999px; overflow:hidden; margin-bottom:7px}
.bar i{display:block; height:100%; border-radius:999px; transition:width .5s var(--ease)}
.wordrow{display:flex; justify-content:space-between; align-items:center; gap:10px;
  border-top:1px solid var(--panel2); padding:10px 0; font-size:14px; color:var(--dim)}
.wordrow b{color:var(--txt); font-weight:600}
.wordrow i{font-style:normal; color:var(--faint)}
.leg{display:flex; flex-wrap:wrap; gap:11px; margin-top:10px;
  font-family:ui-monospace,monospace; font-size:10px; color:var(--faint)}
.leg span{display:flex; align-items:center; gap:5px}
.leg em{width:9px; height:9px; border-radius:3px; display:block}
.wordrow s, .why s{color:var(--dim); text-decoration-color:var(--red); text-decoration-thickness:1.5px}
.card > .wordrow:first-child{border-top:none; padding-top:0}
.dots{display:inline-flex; gap:3px; vertical-align:middle; margin-left:3px}
.dots i{width:7px; height:7px; border-radius:50%; background:var(--line); display:block}
.dots i.on{background:var(--green)}

/* ===== Tagesziel, Serie, Medaillen ===== */
.goal{display:block; width:100%; text-align:left; font-family:inherit; cursor:pointer;
  background:var(--panel); border:1px solid var(--edge); border-radius:var(--r-md);
  padding:11px 14px 12px; margin-bottom:12px; box-shadow:var(--sh-1)}
.goal .gt{display:flex; justify-content:space-between; font-size:13px; font-weight:600;
  color:var(--dim); margin-bottom:8px}
.goal .gt b{color:var(--txt); font-weight:700}
.gb{height:8px; background:var(--panel2); border-radius:9px; overflow:hidden}
.gb i{display:block; height:100%; border-radius:9px; background:linear-gradient(90deg,#fbbf24,#f97316);
  transition:width .5s var(--ease)}
.goal.done .gb i{background:linear-gradient(90deg,#34d399,#059669)}

.hero{position:relative; overflow:hidden; border-radius:var(--r-xl); padding:20px 20px 18px; color:#fff;
  background:linear-gradient(140deg,#f59e0b 0%,#f97316 48%,#e11d48 100%);
  box-shadow:0 20px 40px -20px rgba(225,29,72,.6)}
.hero::before{content:""; position:absolute; right:-60px; top:-80px; width:220px; height:220px;
  border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.28),rgba(255,255,255,0) 70%)}
.hero.cold{background:linear-gradient(140deg,#a8a29e,#57534e); box-shadow:var(--sh-2)}
.herotop{position:relative; display:flex; justify-content:space-between; align-items:center}
.hero .big{font-size:56px; font-weight:800; letter-spacing:-.05em; line-height:1}
.hero .lbl{font-size:13px; font-weight:600; opacity:.92; margin-top:4px}
.hero .say{position:relative; font-size:13.5px; line-height:1.45; margin:12px 0 0; opacity:.95}
.ring{position:relative; width:84px; height:84px}
.ring svg{width:100%; height:100%; display:block}
.ring div{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; line-height:1.05}
.ring b{font-size:20px; font-weight:800; letter-spacing:-.03em}
.ring span{font-size:10px; font-weight:600; opacity:.85}
.week{position:relative; display:flex; justify-content:space-between; margin-top:16px}
.week div{display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px;
  font-weight:600; opacity:.9}

.week i.on{background:#fff}
.week .now i{box-shadow:0 0 0 2px #fff}
.week i.shield{background:rgba(255,255,255,.5)}
.shieldtag{position:relative; display:inline-block; margin-top:10px; padding:6px 11px; border-radius:999px;

.shieldtag.off{opacity:.8}

.tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:12px}
.tiles div{background:var(--panel); border:1px solid var(--edge); border-radius:var(--r-lg);
  padding:12px 6px; text-align:center; box-shadow:var(--sh-1)}
.tiles b{display:block; font-size:21px; font-weight:800; letter-spacing:-.03em}
.tiles span{font-size:11px; color:var(--faint); font-weight:500}

.next{display:flex; gap:14px; align-items:center}
.next .medal{flex:0 0 auto; padding:0; border:none; box-shadow:none; background:none}
.next .medal .disc{margin:0}
.next .info{flex:1; min-width:0}
.next .info b{display:block; font-size:15px; letter-spacing:-.01em}
.next .info span{display:block; font-size:12.5px; color:var(--dim); margin:2px 0 8px}

.mhead{display:flex; justify-content:space-between; align-items:baseline; margin:22px 2px 10px}
.mhead h3{font-size:16px; font-weight:700; letter-spacing:-.02em; margin:0}
.mhead span{font-size:12px; font-weight:600; color:var(--faint)}
.mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.medal{background:var(--panel); border:1px solid var(--edge); border-radius:var(--r-lg);
  padding:14px 6px 12px; text-align:center; box-shadow:var(--sh-1)}
.medal .disc{width:58px; height:58px; margin:0 auto 9px; border-radius:50%; font-size:27px;
  display:flex; align-items:center; justify-content:center}
.medal.bronze .disc{background:radial-gradient(circle at 32% 26%,#ffe6c7,#e08a3c 58%,#9a4a12);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.35), 0 8px 16px -8px rgba(154,74,18,.8)}
.medal.silver .disc{background:radial-gradient(circle at 32% 26%,#ffffff,#cfd8e3 52%,#7b8794);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.55), 0 8px 16px -8px rgba(71,85,105,.7)}
.medal.gold .disc{background:radial-gradient(circle at 32% 26%,#fff8c9,#fbbf24 52%,#b45309);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.45), 0 8px 18px -8px rgba(217,119,6,.9)}
.medal.diamond .disc{background:radial-gradient(circle at 32% 26%,#f5f3ff,#a5b4fc 50%,#6d28d9);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.5), 0 8px 18px -8px rgba(109,40,217,.8)}
.medal.locked .disc{background:var(--panel2); box-shadow:inset 0 0 0 2px var(--line)}
.medal.locked .disc span{filter:grayscale(1); opacity:.3}

.cele{position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center;
  padding:24px; background:rgba(28,25,23,.5);
  -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
.cele.show{display:flex}
.cele .card2{position:relative; z-index:1; width:100%; max-width:340px; background:var(--panel);
  border-radius:30px; padding:30px 22px 20px; text-align:center;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.5); animation:pop .5s var(--ease)}
.cele .medal{border:none; box-shadow:none; background:none; padding:0}
.cele .medal .disc{width:116px; height:116px; font-size:54px; margin-bottom:4px; animation:spin .9s var(--ease)}
.cele .kick{font-size:11px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;

.cele h2{font-size:25px; font-weight:800; letter-spacing:-.035em; margin:14px 0 4px}
.cele p{font-size:14px; line-height:1.45; color:var(--dim); margin:0}
.confetti{position:absolute; inset:0; overflow:hidden; pointer-events:none}
.confetti i{position:absolute; top:-16px; width:8px; height:13px; border-radius:2px;
  animation:fall linear forwards}
@keyframes pop{0%{transform:scale(.82); opacity:0}100%{transform:scale(1); opacity:1}}
@keyframes spin{0%{transform:perspective(400px) rotateY(200deg) scale(.4); opacity:0}
  100%{transform:perspective(400px) rotateY(0) scale(1); opacity:1}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.toast{position:fixed; left:50%; z-index:45; top:calc(env(safe-area-inset-top, 0px) + 10px);

.toast.show{transform:translate(-50%,0)}

:focus-visible{outline:2px solid var(--amber); outline-offset:2px}
@media (prefers-reduced-motion:reduce){

}

</div>

</div>

  best:0,today:0,goalDays:0,chats:0,spoken:0,fixed:0,days:[],medals:{},frz:null,frozen:[]};}

/* Kalendertage in Ortszeit. Math.floor(Date.now()/DAY) wäre UTC und würde
   in Deutschland den Tag um 1 bzw. 2 Uhr nachts wechseln. */
function dayIdx(t){const d=t?new Date(t):new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/DAY);}
function dayStr(back){const d=new Date();d.setDate(d.getDate()-(back||0));return d.toDateString();}
/* 0 = heute geübt, 1 = gestern, 2 = vorgestern, 99 = länger her oder nie.
   Die 2 braucht der Serienschutz: ein verpasster Tag dazwischen. */
function lastAgo(){const l=S.stats.lastDay;
  return l===dayStr(0)?0:(l===dayStr(1)?1:(l===dayStr(2)?2:99));}
/* Serienschutz: ein verpasster Tag pro 7 Tage reißt die Serie nicht.
   frz = Tagnummer des zuletzt geschützten Tages. */
const SHIELD_GAP=7;
function shieldFor(missed){const f=S.stats.frz;return f==null||missed-f>=SHIELD_GAP;}
function shielded(){return lastAgo()===2&&(S.stats.streak||0)>0&&shieldFor(dayIdx()-1);}
function liveStreak(){const a=lastAgo();return a<=1||shielded()?(S.stats.streak||0):0;}
function todayPts(){return lastAgo()===0?(S.stats.today||0):0;}

/* Ältere Sicherungen kennen gram/hist/Medaillen nicht — hier einmal auffüllen,
   damit sich der Rest des Codes auf die Felder verlassen kann. */
function normalise(){
  if(!S.cards)S.cards={};
  if(!Array.isArray(S.extra))S.extra=[];
  if(!Array.isArray(S.chat))S.chat=[];
  if(!S.gram||typeof S.gram!=="object")S.gram={};
  if(!Array.isArray(S.hist))S.hist=[];
  if(!Array.isArray(S.errs))S.errs=[];
  const st=S.stats=Object.assign(blankStats(),S.stats||{});
  if(!st.medals||typeof st.medals!=="object")st.medals={};
  /* Eine laufende Serie von n Tagen heißt: die letzten n Tage wurde geübt.
     Damit sind die Wochenpunkte auch für Bestandsnutzer sofort gefüllt. */
  if(!Array.isArray(st.days)||!st.days.length){
    st.days=[];
    const ago=lastAgo();
    if(ago<=1)for(let i=Math.min(st.streak||0,60)-1;i>=0;i--)st.days.push(dayIdx()-ago-i);
  }
  st.best=Math.max(st.best||0,st.streak||0);
}

/* ================= Tagesziel, Serie, Medaillen ================= */
/* Punkte: Karte 1 · Grammatik-Runde je Aufgabe 1 · gesprochener Satz 2 · Chatnachricht 2. */
const GOAL=20;
function activity(n){
  const st=S.stats, ago=lastAgo();
  if(ago!==0){
    const before=st.streak||0, d=dayIdx(), saved=shielded();
    /* Der geschützte Tag zählt nicht mit, die Serie wächst nur um heute. */
    st.streak=(ago===1||saved)?before+1:1;
    if(saved){st.frz=d-1;st.frozen.push(d-1);if(st.frozen.length>20)st.frozen=st.frozen.slice(-20);}
    st.lastDay=dayStr(0); st.today=0;
    if(!st.days.includes(d))st.days.push(d);
    if(st.days.length>60)st.days=st.days.slice(-60);
    if(saved)toast("🛡️ Serienschutz hat gehalten: Tag "+st.streak);
    else if(st.streak>1)toast("🔥 Tag "+st.streak+" in Folge!");
    else if(before>1)toast("🔥 Neue Serie gestartet");
  }
  const was=st.today||0;
  st.today=was+n;
  if(was<GOAL&&st.today>=GOAL){st.goalDays++;toast("🎯 Tagesziel geschafft!");}
  st.best=Math.max(st.best||0,st.streak);
  checkMedals();
}

    c:Object.entries(S.cards).map(([en,k])=>[en,k.box,Math.round((k.due-now)/3600000)]),
    x:S.extra.map(w=>[w.en,w.de,w.level,w.src==="me"?1:0]),
    /* s[0..2] wie immer, ab s[3] neu: beste Serie, Tagesziele, Chat, Sprechen,
       Tage seit letzter Übung, heutige Punkte. Ältere Leser ignorieren den Rest. */
    s:[st.streak,st.reviews,st.correct,st.best,st.goalDays,st.chats,st.spoken,lastAgo(),todayPts(),st.fixed,
      st.frz==null?-1:today-st.frz],

    /* Fehlerheft: 0 = Grammatik (mit Themen-Index), 1 = Chat-Korrektur. */
    e:S.errs.map(x=>x.k==="g"
      ?[0,GRAMMAR.findIndex(t=>t.t===x.topic),x.q,x.a,x.w||"",x.n||1,x.ok||0]
      :[1,x.q,x.a,x.w||"",x.n||1,x.ok||0]),
    g:Object.keys(S.gram).map(t=>{const i=GRAMMAR.findIndex(x=>x.t===t), g=S.gram[t];
      return i<0?null:[i,g.runs||0,g.best||0,g.lastScore||0,Math.round(((g.last||now)-now)/3600000)];}).filter(Boolean),
    h:S.hist.slice(-45),
    m:Object.keys(st.medals).map(id=>[id,today-st.medals[id]]),
    d:st.days.filter(x=>today-x<30).map(x=>today-x)});
}
function unpackState(t){
  const o=JSON.parse(t.trim());
  if(o&&o.cards) return o;
  if(!o||!o.v) return null;
  const now=Date.now(), cards={}, gram={};
  (o.c||[]).forEach(([en,box,h])=>{cards[en]={box:box,due:now+h*3600000};});
  (o.g||[]).forEach(([i,runs,best,lastScore,hrs])=>{const topic=GRAMMAR[i];
    if(topic)gram[topic.t]={runs:runs||0,best:best||0,lastScore:lastScore||0,last:now+(hrs||0)*3600000};});
  const s=o.s||[], today=dayIdx(), medals={};
  (o.m||[]).forEach(([id,ago])=>{medals[id]=today-(ago||0);});
  const ago=s.length>7?s[7]:99;
  return {cards:cards,
    extra:(o.x||[]).map(([en,de,lv,me])=>({en:en,de:de,level:lv,src:me?"me":"ai"})), chat:[],
    gram:gram, hist:Array.isArray(o.h)?o.h:[],
    errs:(o.e||[]).map(r=>r[0]===0
      ?{k:"g",topic:(GRAMMAR[r[1]]||{}).t||"",q:r[2],a:r[3],w:r[4],n:r[5]||1,ok:r[6]||0,t:Date.now()}
      :{k:"c",q:r[1],a:r[2],w:r[3],n:r[4]||1,ok:r[5]||0,t:Date.now()}).filter(x=>x.q&&x.a),
    stats:{streak:s[0]||0,reviews:s[1]||0,correct:s[2]||0,best:s[3]||0,goalDays:s[4]||0,
      chats:s[5]||0,spoken:s[6]||0,fixed:s[9]||0,lastDay:ago<=2?dayStr(ago):null,today:ago===0?(s[8]||0):0,
      frz:(s.length>10&&s[10]>=0)?today-s[10]:null,frozen:(o.f||[]).map(a=>today-a),
      days:(o.d||[]).map(a=>today-a).sort((a,b)=>a-b),medals:medals}};
}

async function askClaude(messages,system,maxTokens){
  if(!apiKey) throw new Error("Kein API-Key hinterlegt (Sicherung → Key)");
  if(provider==="gemini"){
    /* Zwei Dinge, die teuer gelernt wurden:
       1. Die neuen Flash-Modelle denken vor der Antwort nach, und diese
          Denk-Token zählen gegen maxOutputTokens. Ohne thinkingBudget:0 ging
          das ganze Budget fürs Nachdenken drauf — lange Wartezeit, danach eine
          Antwort komplett ohne Text.
       2. Das Budget war mit 1024 ohnehin zu knapp. */
    const want=Math.max(2048,maxTokens||800);
    const body=(mitDenken)=>JSON.stringify({
      system_instruction:{parts:[{text:system}]},
      contents:messages.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),
      generationConfig:mitDenken
        ?{maxOutputTokens:want}
        :{maxOutputTokens:want,thinkingConfig:{thinkingBudget:0}}
    });
    const call=async(model,mitDenken)=>{
      let res;
      try{
        res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+model+":generateContent",
          {method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":apiKey},body:body(mitDenken)});
      }catch(netErr){
        const err=new Error("Netzwerkfehler: Die Anfrage kam gar nicht bei Google an („Load failed“). Häufigste Ursachen: Key-Einschränkung in AI Studio (Anwendungsbeschränkung „Websites“ ohne deine GitHub-Adresse), Werbeblocker/VPN oder kurz kein Netz. Notlösung: neuen Key ohne Anwendungsbeschränkung anlegen.");
        err.code=0;throw err;
      }
      if(!res.ok){
        let msg="Server antwortet mit "+res.status;
        try{const eb=await res.json();if(eb&&eb.error&&eb.error.message)msg=eb.error.message;}catch(_e){}
        const err=new Error(msg);err.code=res.status;throw err;
      }
      const d=await res.json();
      const c=d.candidates&&d.candidates[0];
      const txt=((c&&c.content&&c.content.parts)||[]).map(p=>p.text||"").join("\n").trim();
      const fr=(c&&c.finishReason)||"";
      const blockiert=d.promptFeedback&&d.promptFeedback.blockReason;
      const denk=(d.usageMetadata&&d.usageMetadata.thoughtsTokenCount)||0;
      /* MAX_TOKENS mit Text: Antwort abgeschnitten — kaputtes JSON zurückgeben
         wäre schlechter als ein Fehler, der die Chain weiterprobieren lässt. */
      if(txt&&fr!=="MAX_TOKENS") return txt;
      let grund;
      if(blockiert)grund="Google hat die Anfrage blockiert ("+blockiert+").";
      else if(fr==="MAX_TOKENS")grund="Die Antwort passte nicht ins Token-Budget"+(denk?", "+denk+" Token gingen fürs interne Nachdenken drauf":"")+".";
      else if(fr==="SAFETY"||fr==="PROHIBITED_CONTENT")grund="Googles Filter hat die Antwort zurückgehalten.";
      else if(fr==="RECITATION")grund="Google hat die Antwort wegen Zitat-Erkennung verworfen.";
      else grund="Das Modell hat nichts zurückgegeben"+(fr?" (Grund: "+fr+")":"")+".";
      const err=new Error(grund+" Modell: "+model+".");
      err.code=204;err.leer=true;throw err;
    };
    /* Kennt ein Modell thinkingConfig nicht, kommt ein 400 zurück.
       Dann derselbe Versuch nochmal ohne den Zusatz. */
    const tryModel=async(model)=>{
      try{return await call(model,false);}
      catch(e){
        if(e.code===400&&/thinking|thought|denk/i.test(e.message||""))return await call(model,true);
        throw e;
      }
    };
    const remember=(m)=>{gModel=m;try{localStorage.setItem(KEY+":gmodel",m);}catch(_e){}};
    const modelGone=(e)=>e.code===404||/not (available|found|supported)|deprecated|no longer|does not exist/i.test(e.message||"");
    const cands=[...new Set([gModel,"gemini-flash-latest","gemini-3.7-flash","gemini-3.6-flash",
      "gemini-flash-lite-latest","gemini-2.5-flash-lite","gemini-2.5-flash"].filter(Boolean))];
    const overloaded=(e)=>e.code===503||e.code===429||/high demand|overloaded|try again|temporar|unavailable|resource.?exhaust|quota/i.test(e.message||"");
    /* Ein aufgebrauchtes Tageskontingent geht durch Warten nicht weg.
       Solche Fehler dürfen den zweiten Durchlauf nicht auslösen, sonst
       wartet der Nutzer minutenlang auf eine Absage, die schon feststeht. */
    const tageslimit=(e)=>e.code===429&&/per ?day|daily|perday|current quota|billing/i.test(e.message||"");
    let lastErr=null, sawOverload=false;
    for(const m of cands){
      try{const t=await tryModel(m);remember(m);return t;}
      catch(e){
        if(modelGone(e)){lastErr=lastErr||e;continue;}
        if(e.leer){lastErr=e;continue;}
        if(tageslimit(e)){lastErr=e;continue;}
        if(overloaded(e)){sawOverload=true;lastErr=e;continue;}
        throw e;
      }
    }
    if(sawOverload){
      // kurz durchatmen, dann ein zweiter Durchlauf — Lastspitzen sind oft nach Sekunden vorbei
      await new Promise(r=>setTimeout(r,2500));
      for(const m of cands){
        try{const t=await tryModel(m);remember(m);return t;}
        catch(e){lastErr=e;}
      }
      throw new Error("Google meldet Überlastung („high demand“) auf allen Gratis-Modellen. Das liegt nicht an deinem Key — eine Minute warten und nochmal versuchen.");
    }
    // Letzter Ausweg: Google nach der aktuellen Modellliste fragen
    try{
      const r=await fetch("https://generativelanguage.googleapis.com/v1beta/models?pageSize=100",
        {headers:{"x-goog-api-key":apiKey}});
      const d=await r.json();
      const pick=((d.models)||[])
        .filter(m=>(m.supportedGenerationMethods||[]).includes("generateContent"))
        .map(m=>String(m.name||"").replace("models/",""))
        .filter(n=>n.includes("flash")&&!/image|live|tts|audio|embed|veo|imagen|thinking/.test(n))
        .sort().reverse()[0];
      if(pick){const t=await tryModel(pick);remember(pick);return t;}
    }catch(_e){}
    if(lastErr&&tageslimit(lastErr))
      throw new Error("Das kostenlose Tageskontingent bei Google ist aufgebraucht. Es füllt sich einmal täglich wieder auf, nach US-Westküstenzeit, bei uns also im Laufe des Vormittags. Bis dahin hilft nur ein anderer Key oder in den Einstellungen der Wechsel auf Anthropic.");
    throw lastErr||new Error("kein Gemini-Modell verfügbar");
  }
  let res;
  try{
    res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
      headers:{"Content-Type":"application/json","x-api-key":apiKey,
        "anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:maxTokens||800,system:system,messages:messages})});
  }catch(netErr){
    throw new Error("Netzwerkfehler: Anfrage kam nicht durch („Load failed“) — Werbeblocker, VPN oder kein Netz?");
  }
  if(!res.ok){
    let msg="Server antwortet mit "+res.status;
    try{const eb=await res.json();if(eb&&eb.error&&eb.error.message)msg=eb.error.message;}catch(_e){}
    throw new Error(msg);
  }
  const d=await res.json();
  return d.content.filter(c=>c.type==="text").map(c=>c.text).join("\n");
}
function parseJSON(text){
  const c=text.replace(/```json/gi,"").replace(/```/g,"").trim();
  const st=[c.indexOf("{"),c.indexOf("[")].filter(i=>i>=0);
  if(!st.length) throw new Error("kein JSON");
  const b=c.slice(Math.min(...st));
  const last=Math.max(b.lastIndexOf("}"),b.lastIndexOf("]"));
  try{return JSON.parse(b.slice(0,last+1));}catch(e){}
  const objs=[];let d=0,s0=-1,inS=false,escp=false;
  for(let i=0;i<b.length;i++){const ch=b[i];
    if(inS){if(escp)escp=false;else if(ch==="\\")escp=true;else if(ch==='"')inS=false;continue;}
    if(ch==='"'){inS=true;continue;}
    if(ch==="{"){if(d===0)s0=i;d++;}
    else if(ch==="}"){d--;if(d===0&&s0>=0){try{objs.push(JSON.parse(b.slice(s0,i+1)));}catch(e){}s0=-1;}}}
  if(objs.length===1)return objs[0];
  if(objs.length)return objs;
  throw new Error("Antwort unvollständig");
}

let V={level:"A1",reverse:false,queue:[],idx:0,flipped:false,right:0,wrong:0,loading:false,err:"",
  view:"cards",nwEn:"",nwDe:"",nwLv:"B1",msg:"",prog:"",added:0};
function pool(){return V.level==="Alle"?allWords():allWords().filter(w=>w.level===V.level);}
function buildRound(){
  const now=Date.now(), p=pool();
  const due=shuffle(p.filter(w=>S.cards[w.en]&&S.cards[w.en].due<=now));
  const fresh=p.filter(w=>!S.cards[w.en]).slice(0,8);
  V.queue=shuffle(due.slice(0,Math.max(0,20-fresh.length)).concat(fresh));
  V.idx=0;V.flipped=false;V.right=0;V.wrong=0;
}
function grade(known){
  const w=V.queue[V.idx]; if(!w)return;
  const now=Date.now(), prev=S.cards[w.en]||{box:1};
  const box=known?Math.min(5,prev.box+1):1;
  S.cards[w.en]={box:box,due:now+INTERVALS[box]*DAY};
  S.stats.reviews++; if(known)S.stats.correct++;
  activity(1);
  if(known){V.right++;V.idx++;}
  else{V.wrong++;const q=V.queue;const c=q.splice(V.idx,1)[0];q.splice(Math.min(q.length,V.idx+3),0,c);}
  V.flipped=false; snapshot(); save(); render();
}

/* Nachladen in Runden zu 20. Die Liste der bekannten Wörter wird gekappt,
   sonst wächst der Prompt mit dem Bestand ins Absurde. */
async function loadMore(n){
  const want=n||20, rounds=Math.max(1,Math.ceil(want/20));
  V.loading=true;V.err="";V.added=0;V.prog="";render();
  for(let r=0;r<rounds;r++){
    V.prog=(r+1)+" / "+rounds;render();
    try{
      const lv=V.level==="Alle"?"B1":V.level;
      const have=new Set(allWords().map(w=>w.en));
      const known=allWords().filter(w=>w.level===lv).map(w=>w.en).slice(-300);
      const txt=await askClaude([{role:"user",content:"Level "+lv+". Bereits vorhanden: "+known.join(", ")+". Gib 20 NEUE englische Wörter dieses Levels (die nächsthäufigsten, keine aus der Liste)."}],
        'Vokabeln für einen deutschsprachigen Lerner. Antworte NUR mit JSON-Array: [{"en":"word","de":"Übersetzung","level":"'+lv+'"}]. Übersetzung max 3 Wörter.');
      let k=0;
      parseJSON(txt).forEach(w=>{
        const en=w&&w.en?String(w.en).toLowerCase().trim():"";
        if(en&&w.de&&!have.has(en)){S.extra.push({en:en,de:String(w.de).trim(),level:lv,src:"ai"});have.add(en);k++;}
      });
      V.added+=k; save();
      if(!k)break;
    }catch(e){V.err=e.message;break;}
  }
  V.loading=false;V.prog="";buildRound();render();
}

function addWord(){
  syncForms();
  const en=String(V.nwEn||"").trim().toLowerCase(), de=String(V.nwDe||"").trim(), lv=V.nwLv||"B1";
  if(!en||!de){V.msg="Bitte englisches und deutsches Wort eintragen.";render();return;}
  if(allWords().some(w=>w.en===en)){V.msg="„"+en+"“ liegt schon im Kasten.";render();return;}
  S.extra.push({en:en,de:de,level:lv,src:"me"});
  V.nwEn="";V.nwDe="";V.msg="„"+en+"“ hinzugefügt.";
  clearField("nwEn");clearField("nwDe");
  save();buildRound();render();
}
function delWord(en){

}

function statsHtml(){
  const total=allWords().length, counts=[0,0,0,0,0];
  Object.values(S.cards).forEach(c=>{counts[Math.min(4,Math.max(0,(c.box||1)-1))]++;});
  const seen=counts.reduce((a,b)=>a+b,0);
  const acc=S.stats.reviews?Math.round(S.stats.correct/S.stats.reviews*100):0;
  const due=Object.values(S.cards).filter(c=>c.due<=Date.now()).length;
  const kv=(a,b)=>'<div class="kv"><span>'+a+'</span><b>'+b+'</b></div>';
  let h='<div class="card"><h3>Überblick</h3>';
  h+=kv("Wörter insgesamt",total);
  h+=kv("schon angefangen",seen);
  h+=kv("noch nie gesehen",total-seen);
  h+=kv("jetzt fällig",due);
  h+=kv("Wiederholungen",S.stats.reviews);
  h+=kv("Trefferquote",acc+" %");
  h+=kv("Serie",S.stats.streak+" Tage");
  h+='</div>';

  h+='<div class="card"><h3>Fächer</h3>';
  counts.forEach((c,i)=>{
    h+='<div class="kv"><span>Fach '+(i+1)+' · '+BOXLBL[i]+'</span><b>'+c+'</b></div>';
    h+='<div class="bar"><i style="width:'+(seen?Math.round(c/seen*100):0)+'%;background:'+BOXC[i]+'"></i></div>';
  });
  h+='</div>';

  h+='<div class="card"><h3>Verlauf</h3>';
  const H=S.hist.slice(-30);
  if(H.length<2){
    h+='<p class="why">Ein Punkt pro Übungstag. Ab dem zweiten Tag wächst hier die Kurve.</p>';
  }else{
    const W=320, HT=124, pad=10, bot=HT-16, top=8;
    const max=Math.max(1,...H.map(r=>r[1]+r[2]+r[3]+r[4]+r[5]));
    const step=(W-pad*2)/H.length, bw=Math.max(2.5,step-2);
    let g="";
    H.forEach((r,i)=>{
      const x=pad+i*step; let y=bot;
      for(let b=5;b>=1;b--){
        const hgt=r[b]/max*(bot-top);
        if(hgt<=0.2)continue;
        y-=hgt;
        g+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+hgt.toFixed(1)+'" fill="'+BOXC[b-1]+'"/>';
      }
    });
    const dl=n=>new Date(n*DAY).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"});
    h+='<svg viewBox="0 0 '+W+' '+HT+'" style="width:100%;height:auto;display:block">'+g
      +'<line x1="'+pad+'" y1="'+bot+'" x2="'+(W-pad)+'" y2="'+bot+'" style="stroke:var(--line)" stroke-width="1"/>'
      +'<text x="'+pad+'" y="'+(HT-4)+'" font-size="8" style="fill:var(--faint)">'+dl(H[0][0])+'</text>'
      +'<text x="'+(W-pad)+'" y="'+(HT-4)+'" font-size="8" style="fill:var(--faint)" text-anchor="end">'+dl(H[H.length-1][0])+'</text>'
      +'<text x="'+pad+'" y="'+(top-1)+'" font-size="8" style="fill:var(--faint)">'+max+'</text></svg>';
    h+='<div class="leg">'+BOXC.map((c,i)=>'<span><em style="background:'+c+'"></em>Fach '+(i+1)+'</span>').join("")+'</div>';
  }
  h+='</div>';
  return h;
}

/* ================= Erfolge ================= */
function goalStrip(){
  const t=todayPts(), done=t>=GOAL;
  return '<button class="goal'+(done?" done":"")+'" onclick="go(\'medals\')"><div class="gt"><span>'
    +(done?"🎯 Tagesziel geschafft":"Tagesziel heute")+'</span><b>'+t+' / '+GOAL+'</b></div>'
    +'<div class="gb"><i style="width:'+Math.min(100,Math.round(t/GOAL*100))+'%"></i></div></button>';
}
function ringHtml(t){
  const r=30, c=2*Math.PI*r, p=Math.min(1,t/GOAL);
  return '<div class="ring"><svg viewBox="0 0 72 72">'
    +'<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="7"/>'
    +'<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"'
    +' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p)).toFixed(1)+'" transform="rotate(-90 36 36)"/>'
    +'</svg><div><b>'+t+'</b><span>von '+GOAL+'</span></div></div>';
}
function streakSay(){
  const live=liveStreak(), ago=lastAgo(), t=todayPts(), best=S.stats.best||0;
  if(!S.stats.lastDay&&!best)return "Starte heute deine Serie. Schon eine Karte zählt — mit "+GOAL+" Punkten ist das Tagesziel erreicht.";
  if(ago===0&&t>=GOAL)return "Tagesziel geschafft. Komm morgen wieder, dann steht die Serie bei "+(live+1)+" Tagen.";
  if(ago===0)return "Heute bist du dabei. Noch "+(GOAL-t)+" Punkte bis zum Tagesziel.";
  if(ago===1)return "Heute noch nicht geübt. Eine einzige Karte rettet deine Serie von "+live+(live===1?" Tag.":" Tagen.");
  if(shielded())return "Gestern ausgelassen. Der Serienschutz hält deine Serie von "+live+(live===1?" Tag":" Tagen")+" — aber nur, wenn du heute übst.";
  return "Die Serie ist gerissen — kein Drama. Eine Karte heute, und es geht wieder los. Deine Bestmarke: "+best+(best===1?" Tag.":" Tage.");
}
/* Zeile unter dem Spruch: Ist der Schutz bereit, oder ab wann wieder? */
function shieldHtml(){
  if(!liveStreak()||shielded())return "";
  const d=dayIdx(), next=lastAgo()===0?d+1:d;
  if(shieldFor(next))return '<div class="shieldtag">🛡️ Serienschutz bereit · ein verpasster Tag pro Woche ist erlaubt</div>';
  const n=S.stats.frz+SHIELD_GAP-next;
  return '<div class="shieldtag off">🛡️ Serienschutz wieder bereit in '+n+(n===1?" Tag":" Tagen")+'</div>';
}
function weekHtml(){
  const set=new Set(S.stats.days), frz=new Set(S.stats.frozen), today=dayIdx(), WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
  if(shielded())frz.add(today-1);
  let h='<div class="week">';
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const on=set.has(today-i), sh=!on&&frz.has(today-i);
    h+='<div'+(i===0?' class="now"':'')+'><i class="'+(on?"on":(sh?"shield":""))+'">'+(on?"🔥":(sh?"🛡️":""))+'</i>'+WD[d.getDay()]+'</div>';
  }
  return h+'</div>';
}
/* Medaillen-Stände einmal pro Aufbau des Erfolge-Tabs berechnen. Einige
   val()-Funktionen laufen über alle Karten, und jede Medaille wurde doppelt
   gefragt (Kachel und „Als Nächstes"). */
let MV=null;
const mval=m=>MV&&m.id in MV?MV[m.id]:m.val();
function medalCard(m){
  const got=!!S.stats.medals[m.id], v=Math.min(mval(m),m.need);
  let h='<div class="medal '+m.tier+(got?"":" locked")+'"><div class="disc"><span>'+m.icon+'</span></div>';
  h+='<div class="nm">'+esc(m.name)+'</div><div class="ds">'+esc(m.desc)+'</div>';
  if(!got)h+='<div class="gb"><i style="width:'+Math.round(v/m.need*100)+'%"></i></div>';
  return h+'</div>';
}
/* Als Nächstes: die offene Medaille, der man am nächsten ist. */
function nextMedal(){
  let best=null, bp=-1;
  MEDALS.forEach(m=>{if(S.stats.medals[m.id])return;
    const p=Math.min(1,mval(m)/m.need); if(p>bp){bp=p;best=m;}});
  return best;
}
function renderMedals(){
  const ms=mastered(), gd=gramDone();
  MV={};
  MEDALS.forEach(m=>{MV[m.id]=m.cat==="wissen"?ms:(m.cat==="gram"?gd:m.val());});

  h+='<div class="big">🔥 '+live+'</div><div class="lbl">'+(live===1?"Tag":"Tage")+' in Folge</div></div>';
  h+=ringHtml(t)+'</div><p class="say">'+esc(streakSay())+'</p>'+shieldHtml()+weekHtml()+'</div>';
  h+='<div class="tiles"><div><b>'+(S.stats.best||0)+'</b><span>beste Serie</span></div>'
    +'<div><b>'+(S.stats.goalDays||0)+'</b><span>Tagesziele</span></div>'
    +'<div><b>'+got+'<small style="font-size:13px;color:var(--faint)"> / '+MEDALS.length+'</small></b><span>Medaillen</span></div></div>';
  const n=nextMedal();
  if(n){
    const v=Math.min(mval(n),n.need), rest=n.need-v;
    h+='<div class="card next">'+discHtml(n,true)+'<div class="info"><span style="margin:0 0 2px;font-weight:600;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.08em">Als Nächstes</span>'
      +'<b>'+esc(n.name)+'</b><span>noch '+rest+' '+(rest===1?n.one:n.many)+' · '+esc(n.desc)+'</span>'
      +'<div class="gb"><i style="width:'+Math.round(v/n.need*100)+'%"></i></div></div></div>';
  }
  MCATS.forEach(([k,title])=>{
    const list=MEDALS.filter(m=>m.cat===k), have=list.filter(m=>S.stats.medals[m.id]).length;
    h+='<div class="mhead"><h3>'+title+'</h3><span>'+have+' / '+list.length+'</span></div>';
    h+='<div class="mgrid">'+list.map(medalCard).join("")+'</div>';
  });
  h+='<div class="card"><h3>So zählen Punkte</h3><p class="why">Karte 1 · Grammatik je Aufgabe 1 · Fehler aus dem Heft 1 · nachgesprochener Satz 2 · Nachricht an Oliver 2. '
    +'Für die Serie reicht ein Punkt am Tag, das Tagesziel liegt bei '+GOAL+'. '
    +'Der Serienschutz fängt einen verpassten Tag pro Woche ab.</p></div>';
  MV=null;
  $("main").innerHTML=h;
}

/* ================= Grammatik ================= */
let G={topic:null,items:[],rule:[],answers:{},checked:false,loading:false,err:""};
function isRight(it,val){return String(it.a).split("/").some(a=>norm(a)===norm(val||""));}
function openTopic(i){
  const t=GRAMMAR[i];
  G={topic:t.t,rule:t.r,items:shuffle(t.i).slice(0,6),answers:{},checked:false,loading:false,err:""};
  render();
}
function checkG(){
  syncForms();
  G.checked=true;
  recordGram();
  render();
}
function recordGram(){
  if(!G.topic||!G.items.length)return;
  const hit=G.items.filter((it,i)=>isRight(it,G.answers[i])).length;
  const pct=Math.round(hit/G.items.length*100);
  const g=S.gram[G.topic]||{runs:0,best:0,lastScore:0,last:0};
  g.runs++; g.best=Math.max(g.best||0,pct); g.lastScore=pct; g.last=Date.now();
  S.gram[G.topic]=g;
  G.items.forEach((it,i)=>{
    if(isRight(it,G.answers[i]))hitErr("g",it.q);
    else addErr({k:"g",topic:G.topic,q:it.q,a:it.a,w:it.w||"",given:String(G.answers[i]||"").trim()});
  });
  activity(G.items.length);
  save();
}

/* ================= Fehlerheft ================= */
/* Gesammelt werden falsche Grammatik-Antworten und Olivers Korrekturen.
   Ein Fehler gilt als ausgebügelt, wenn er ERR_DONE-mal in Folge richtig kam.
   Eine falsche Antwort setzt die Folge zurück. */
const ERR_MAX=60, ERR_DONE=2;
let E={on:false,list:false,queue:[],idx:0,ans:"",checked:false,right:false,hits:0,fixed:0};
function addErr(e){
  const ex=S.errs.find(x=>x.k===e.k&&x.q===e.q);
  if(ex){ex.n=(ex.n||1)+1;ex.ok=0;ex.t=Date.now();if(e.given)ex.given=e.given;return;}
  S.errs.push(Object.assign({n:1,ok:0,t:Date.now()},e));
  if(S.errs.length>ERR_MAX)S.errs=S.errs.slice(-ERR_MAX);
}
function solveErr(e){
  e.ok=(e.ok||0)+1;
  if(e.ok>=ERR_DONE){S.errs=S.errs.filter(x=>x!==e);S.stats.fixed++;return true;}
  return false;
}
/* Richtig beantwortet im normalen Grammatik-Üben zählt auch fürs Heft. */
function hitErr(k,q){const e=S.errs.find(x=>x.k===k&&x.q===q); if(e)solveErr(e);}
/* Oliver liefert "falsche Stelle → Korrektur (Grund)", bis zu zwei Stück. */
function parseCorr(c){
  return String(c||"").split(/\n|;\s+/).map(s=>{
    const parts=s.split(/→|->/); if(parts.length<2)return null;
    let a=parts.slice(1).join(" ").trim(), w="";
    const m=a.match(/\(([^)]*)\)\s*\.?$/); if(m){w=m[1].trim();a=a.slice(0,m.index).trim();}
    const strip=x=>x.trim().replace(/^["'„“”]+|["'“”]+$/g,"").trim();
    const q=strip(parts[0]); a=strip(a);
    return q&&a&&norm(q)!==norm(a)?{k:"c",q:q,a:a,w:w}:null;
  }).filter(Boolean);
}
function startErrs(){
  const pick=S.errs.slice().sort((x,y)=>(x.ok-y.ok)||(y.n-x.n)).slice(0,10);
  E={on:true,list:true,queue:shuffle(pick),idx:0,ans:"",checked:false,right:false,hits:0,fixed:0};
  clearField("errin");
  render();
}
function checkErr(){
  syncForms();
  const e=E.queue[E.idx]; if(!e||E.checked)return;
  E.checked=true;
  E.right=String(e.a).split("/").some(a=>norm(a)===norm(E.ans||""));
  if(E.right){E.hits++;if(solveErr(e))E.fixed++;}
  else{e.ok=0;e.n=(e.n||1)+1;}
  activity(1); save(); render();
}
/* Für Synonyme und Varianten, die der Textvergleich nicht kennt. */
function overrideErr(){
  const e=E.queue[E.idx]; if(!e||!E.checked||E.right)return;
  E.right=true; E.hits++; e.n=Math.max(1,(e.n||1)-1);
  if(solveErr(e))E.fixed++;
  save(); render();
}
function nextErr(){E.idx++;E.ans="";E.checked=false;E.right=false;clearField("errin");render();}
function delErr(i){S.errs.splice(i,1);save();render();}
function errDots(e){
  let h='<span class="dots">';
  for(let i=0;i<ERR_DONE;i++)h+='<i class="'+(i<(e.ok||0)?"on":"")+'"></i>';
  return h+'</span>';
}
function errsHtml(){
  const q=E.queue;
  if(E.on&&E.idx<q.length){
    const e=q[E.idx];
    let h='<p class="meta">FEHLER '+(E.idx+1)+' / '+q.length+' · '+(e.k==="g"?"Grammatik: "+esc(e.topic||""):"aus dem Chat")+'</p>';
    h+='<div class="card">';
    if(e.k==="g"){
      h+='<div style="font-size:16px;line-height:1.45">'+esc(e.q)+'</div>';
      if(e.given)h+='<p class="why">Damals geschrieben: <s>'+esc(e.given)+'</s></p>';
    }else{
      h+='<p class="why" style="margin:0 0 4px">Du hast geschrieben:</p>';
      h+='<div class="target" style="font-size:20px"><s style="text-decoration-color:var(--red)">'+esc(e.q)+'</s></div>';
      h+='<p class="why">Wie heißt es richtig?'+(e.w?' Tipp: '+esc(e.w):'')+'</p>';
    }
    h+='<input type="text" id="errin" value="'+esc(E.ans||"")+'" placeholder="'+(e.k==="g"?"Lücke füllen":"richtige Version")+'" lang="en" autocapitalize="none" autocorrect="off"'
      +' class="'+(E.checked?(E.right?"ok":"no"):"")+'"'+(E.checked?" readonly":"")
      +' onkeydown="if(event.key===\'Enter\'){'+(E.checked?'nextErr()':'checkErr()')+'}">';
    if(E.checked){
      if(E.right){
        const gone=!S.errs.includes(e);
        h+='<p class="why"><b>Richtig.</b> '+(gone?"Ausgebügelt, der Fehler verschwindet aus dem Heft.":"Noch "+(ERR_DONE-e.ok)+"× richtig, dann ist er ausgebügelt.")+'</p>';
      }else{
        h+='<p class="why"><b>'+esc(e.a)+'</b>'+(e.w&&e.k==="g"?' — '+esc(e.w):'')+'</p>';
        h+='<button class="linkbtn" style="color:var(--dim)" onclick="overrideErr()">Meine Antwort war auch richtig</button>';
      }
    }
    h+='</div>';
    h+=E.checked?'<button class="btn primary" onclick="nextErr()">Weiter</button>'
                :'<button class="btn primary" onclick="checkErr()">Prüfen</button>';
    h+='<button class="btn ghost" onclick="E.on=false;render()">Abbrechen</button>';
    return h;
  }
  if(E.on){
    let h='<div class="card center"><h3>Runde fertig</h3>';
    h+='<p class="why">'+E.hits+' von '+q.length+' richtig'+(E.fixed?' · <b>'+E.fixed+' ausgebügelt</b>':'')+'</p>';
    if(S.errs.length)h+='<button class="btn primary" onclick="startErrs()">Nächste Runde</button>';
    h+='<button class="btn ghost" onclick="E.on=false;render()">Zur Liste</button></div>';
    return h;
  }
  const n=S.errs.length;
  let h='<div class="card"><h3>Fehlerheft</h3>';
  if(!n){
    h+='<p class="why">Gerade leer. Falsche Grammatik-Antworten und Olivers Korrekturen aus dem Chat landen automatisch hier.'
      +(S.stats.fixed?' Bisher ausgebügelt: <b>'+S.stats.fixed+'</b>.':'')+'</p></div>';
    return h;
  }
  h+='<p class="why">'+n+' offen'+(S.stats.fixed?' · '+S.stats.fixed+' ausgebügelt':'')+'. Ein Fehler verschwindet, wenn du ihn '+ERR_DONE+'× hintereinander richtig hast.</p>';
  h+='<button class="btn primary" onclick="startErrs()">'+Math.min(10,n)+' Fehler üben</button></div>';
  h+='<div class="card">';
  S.errs.slice().reverse().forEach(e=>{
    const i=S.errs.indexOf(e);
    const txt=e.k==="g"
      ?(e.q.includes("___")?esc(e.q).replace("___","<b>"+esc(e.a)+"</b>"):esc(e.q)+" → <b>"+esc(e.a)+"</b>")
      :"<s>"+esc(e.q)+"</s> → <b>"+esc(e.a)+"</b>";
    h+='<div class="wordrow"><span style="min-width:0">'+txt
      +'<br><i class="mono">'+(e.k==="g"?esc(e.topic||"Grammatik"):"Chat")+(e.n>1?" · "+e.n+"× falsch":"")+'</i> '+errDots(e)+'</span>'
      +'<button class="x" style="width:30px;height:30px;font-size:13px;flex:0 0 auto" onclick="delErr('+i+')">&#10005;</button></div>';
  });
  return h+'</div>';
}
async function aiSet(){
  G.loading=true;G.err="";render();
  try{
    const txt=await askClaude([{role:"user",content:"Thema: "+G.topic}],
      'Englischlehrer für deutschsprachigen Lerner (B1). NUR JSON: {"items":[{"q":"Satz mit ___ (Hinweis)","a":"Lösung","w":"Erklärung deutsch, max 8 Wörter"}]} — genau 5 items. Mehrere Lösungen mit / trennen.');
    const raw=parseJSON(txt);
    const items=(Array.isArray(raw)?raw:raw.items||[]).filter(x=>x&&x.q&&x.a);
    if(!items.length)throw new Error("keine Aufgaben erhalten");
    G.items=items;G.answers={};G.checked=false;
  }catch(e){G.err=e.message;}
  G.loading=false;render();
}

    const done=GRAMMAR.filter(t=>(S.gram[t.t]||{}).best>=80).length;

      h+='<input type="text" id="g'+i+'" value="'+esc(G.answers[i]||"")+'" placeholder="deine Antwort" class="'+(G.checked?(ok?"ok":"no"):"")+'"'+(G.checked?" readonly":"")+'>';
      if(G.checked&&!ok)h+='<p class="why"><b>'+esc(it.a)+'</b> — '+esc(it.w)+'</p>';
      h+='</div>';
    });
    if(G.checked){
      const score=G.items.filter((it,i)=>isRight(it,G.answers[i])).length;
      h+='<div class="card center"><div class="score">'+score+' / '+G.items.length+'</div>';
      h+='<button class="btn primary" onclick="openTopic('+GRAMMAR.findIndex(t=>t.t===G.topic)+')">Nochmal mischen</button>';
      h+='<button class="btn ghost" onclick="aiSet()"'+(G.loading?" disabled":"")+'>'+(G.loading?"lädt …":"✦ Neue Sätze (KI)")+'</button>';
      if(G.err)h+='<p class="why" style="color:var(--red)">'+esc(G.err)+'</p>';
      h+='</div>';

      h+='<button class="btn primary" onclick="checkG()">Prüfen</button>';

  $("main").innerHTML=h;

/* ================= Spracherkennung ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let recActive=false,recObj=null,recErr="";
const REC_HINTS={
  "not-allowed":"iOS lässt die Spracherkennung hier nicht zu. Vom Home-Bildschirm aus blockiert iOS sie generell — nutze das Tastatur-Diktat unten oder öffne die Seite direkt in Safari.",
  "service-not-allowed":"iOS blockiert den Erkennungsdienst. Prüfe: Einstellungen → Allgemein → Tastatur → „Diktieren“ aktivieren. Oder nutze das Tastatur-Diktat unten.",
  "no-speech":"Nichts gehört — nochmal versuchen, etwas näher ans Mikrofon.",
  "audio-capture":"Kein Mikrofon gefunden. Mikrofon-Zugriff für Safari erlaubt? (Einstellungen → Apps → Safari → Mikrofon)",
  "network":"Die Erkennung braucht eine Internetverbindung."
};
function record(cb,rerender){
  if(!SR)return;
  const rr=()=>{if(rerender)render();};
  if(recActive){try{recObj.stop();}catch(e){}recActive=false;rr();return;}
  recErr="";
  recObj=new SR();recObj.lang="en-GB";recObj.interimResults=false;recObj.maxAlternatives=1;
  recObj.onresult=e=>{cb(e.results[0][0].transcript);};
  recObj.onend=()=>{recActive=false;rr();};
  recObj.onerror=e=>{recErr=REC_HINTS[e.error]||("Erkennung abgebrochen ("+(e.error||"unbekannt")+"). Nutze zur Not das Tastatur-Diktat unten.");recActive=false;rr();};
  try{recObj.start();recActive=true;rr();}
  catch(e){recErr="Konnte nicht starten — nutze das Tastatur-Diktat unten.";recActive=false;rr();}
}

/* ================= Sprechen ================= */
let P={bank:SPEAK_SEED,i:0,said:"",typed:"",loading:false,counted:-1};
/* Punkte nur einmal pro Satz, sonst ließe sich das Tagesziel per
   „Vergleichen“-Dauertippen erreichen. */
function spoke(t){
  P.said=t;
  if(String(t||"").trim()&&P.counted!==P.i){P.counted=P.i;S.stats.spoken++;activity(2);save();}
  render();
}
function alignWords(target,said){
  const t=norm(target).split(" ").filter(Boolean), s=norm(said).split(" ").filter(Boolean);
  const dp=Array.from({length:t.length+1},()=>new Array(s.length+1).fill(0));
  for(let i=1;i<=t.length;i++)for(let j=1;j<=s.length;j++)
    dp[i][j]=t[i-1]===s[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const m=new Set();let i=t.length,j=s.length;
  while(i>0&&j>0){if(t[i-1]===s[j-1]){m.add(i-1);i--;j--;}else if(dp[i-1][j]>=dp[i][j-1])i--;else j--;}
  return{words:t,m:m,score:t.length?Math.round(m.size/t.length*100):0};
}
async function moreSentences(){
  P.loading=true;render();
  try{
    const txt=await askClaude([{role:"user",content:"8 neue Sätze, Alltag und Büro gemischt."}],
      'NUR JSON-Array aus 8 englischen Sätzen (je 8–14 Wörter, britisch, B1): ["…"]');
    const arr=parseJSON(txt).filter(s=>typeof s==="string");
    if(arr.length){P.bank=arr;P.i=0;P.said="";P.typed="";P.counted=-1;}
  }catch(e){}
  P.loading=false;render();
}
function renderSpeak(){
  const target=P.bank[P.i%P.bank.length];
  const r=P.said?alignWords(target,P.said):null;
  let h='<p class="meta">NACHSPRECHEN · SATZ '+((P.i%P.bank.length)+1)+' / '+P.bank.length+'</p>';
  h+='<div class="card"><div class="target">';
  h+=r?r.words.map((w,k)=>'<span class="'+(r.m.has(k)?"hit":"miss")+'">'+esc(w)+' </span>').join("")
      :esc(target);
  h+='</div><button class="btn ghost" style="width:auto;padding:10px 16px" onclick="speak('+JSON.stringify(target).replace(/"/g,"&quot;")+')">&#9654; Vorsprechen lassen</button></div>';
  if(r)h+='<div class="card center"><div class="score">'+r.score+'%</div><p class="why">Verstanden: „'+esc(P.said)+'“</p></div>';
  if(SR){
    if(navigator.standalone)h+='<p class="why">Hinweis: Als Home-Bildschirm-App blockiert iOS die Web-Spracherkennung oft. Tut der Knopf nichts, nimm das Tastatur-Diktat darunter.</p>';
    h+='<button class="btn '+(recActive?"bad":"primary")+'" onclick="P.said=\'\';record(spoke,true)">'+(recActive?"&#127908; Höre zu … tippen zum Stoppen":"&#127908; Aufnehmen und nachsprechen")+'</button>';
    if(recErr)h+='<p class="why" style="color:var(--red)">'+esc(recErr)+'</p>';
  }
  h+='<div class="card"><p class="why">'+(SR?"Geht immer, auch wenn das Mikro oben streikt:":"Web-Spracherkennung ist hier nicht verfügbar — so geht es trotzdem:")+' Feld antippen, dann das Mikrofon-Symbol auf der iOS-Tastatur drücken (Diktat) und den Satz sprechen. Fehlt das Symbol: Einstellungen → Allgemein → Tastatur → „Diktieren“ einschalten.</p>';
  h+='<input type="text" id="typedbox" value="'+esc(P.typed)+'" placeholder="hier per Tastatur-Diktat sprechen" lang="en">';
  h+='<button class="btn ghost" onclick="syncForms();spoke(P.typed)">Vergleichen</button></div>';
  h+='<div class="row"><button class="btn ghost" onclick="P.i++;P.said=\'\';P.typed=\'\';render()">↻ Nächster Satz</button>';
  h+='<button class="btn ghost" onclick="moreSentences()"'+(P.loading?" disabled":"")+'>'+(P.loading?"lädt …":"✦ Neue Sätze (KI)")+'</button></div>';
  $("main").innerHTML=h;
}

/* ================= Chat ================= */
/* Gezeigt werden die letzten CHAT_PAGE Nachrichten, gespeichert höchstens CHAT_MAX. */
const CHAT_PAGE=40, CHAT_MAX=300;
let C={loading:false,err:"",draft:"",confirmClear:false,show:CHAT_PAGE,keep:null};
/* Diktat hängt an das Feld an, nicht an C.draft — das DOM ist die Quelle,
   syncForms holt den Wert beim Neuzeichnen von dort. */
function chatDictated(t){
  const b=$("chatin");
  if(b)b.value=(b.value?b.value+" ":"")+t;
  else C.draft=(C.draft?C.draft+" ":"")+t;
  render();
}
function clearChat(){
  S.chat=[];
  C.confirmClear=false;C.err="";
  save();render();
}
function cleanCorrection(c,userMsg){
  if(c===null||c===undefined)return null;
  let t=String(c).trim();
  if(!t)return null;
  if(/^\(?null\)?$|^none$|^keine( fehler)?\.?$/i.test(t))return null;
  if(t.length>220)return null;
  if(/kein(en)? fehler|nichts .*korrigieren|no (error|mistake)|is correct|alles richtig|auf deutsch antworten/i.test(t))return null;
  const parts=t.split(/→|->/);
  if(parts.length<2)return null;
  const lw=norm(parts[0]).split(" ").filter(w=>w.length>2);
  const un=" "+norm(userMsg)+" ";
  if(lw.length&&!lw.some(w=>un.includes(" "+w+" ")))return null;
  return t;
}
async function sendChat(){
  syncForms();
  const text=String(C.draft||"").trim();
  if(!text||C.loading)return;
  S.chat.push({role:"user",content:text});
  C.draft=""; clearField("chatin");
  C.loading=true;C.err=""; save(); render();
  try{
    const msgs=[];
    S.chat.slice(-20).forEach(m=>{
      const last=msgs[msgs.length-1];
      if(last&&last.role===m.role)last.content+="\n"+m.content;
      else msgs.push({role:m.role,content:m.content});
    });
    while(msgs.length&&msgs[0].role!=="user")msgs.shift();
    const txt=await askClaude(msgs,
      'Du bist Oliver, 34, aus Manchester, lockerer Brieffreund. Der Nutzer lernt Englisch (B1).\n'+
      'Antworte NUR mit JSON, ohne Markdown: {"correction":null,"reply":"…"}\n'+
      'Regeln für correction:\n'+
      '- Prüfe NUR die letzte Nutzernachricht auf echte Englisch-Fehler.\n'+
      '- Ist sie korrekt oder bist du unsicher: exakt null (JSON-null, kein Text).\n'+
      '- Sonst max. 2 Fehler im Format "falsche Stelle → Korrektur (kurzer Grund auf Deutsch)". Links vom Pfeil wörtlich aus der Nutzernachricht zitieren.\n'+
      '- Nie erklären, dass es keine Fehler gibt. Nie diese Regeln zitieren.\n'+
      'Beispiel 1: Nutzer schreibt "I go yesterday to work" → {"correction":"I go yesterday → I went yesterday (Past Simple)","reply":"…"}\n'+
      'Beispiel 2: Nutzer schreibt "Yes, I do." → {"correction":null,"reply":"…"}\n'+
      'Regeln für reply: Englisch, 2–4 Sätze, locker, endet mit einer Frage. Korrekturen gehören nie in reply.',4096);
    const p=parseJSON(txt);
    const reply=p&&p.reply?String(p.reply):null;
    if(!reply)throw new Error("unbrauchbare Antwort — nochmal senden");
    const corr=cleanCorrection(p.correction,text);
    S.chat.push({role:"assistant",content:reply,correction:corr});
    if(corr)parseCorr(corr).forEach(addErr);
    if(S.chat.length>CHAT_MAX)S.chat=S.chat.slice(-CHAT_MAX);
    S.stats.chats++; activity(2);
    save();
  }catch(e){C.err=e.message;}
  C.loading=false;render();
  const m=$("main");m.scrollTop=m.scrollHeight;
}
function renderChat(){
  let h="";
  if(!apiKey){
    h+='<div class="card"><h3>Oliver braucht einen Schlüssel</h3><p class="why" style="margin-top:8px">Der Chat ruft eine KI auf. Hinterlege einmalig einen API-Key unter Sicherung — mit Google Gemini kostenlos, ohne Kreditkarte.</p><button class="btn primary" onclick="openBackup()">Zu den Einstellungen</button></div>';
    $("main").innerHTML=h; return;
  }
  if(!S.chat.length)h+='<div class="card"><h3>Oliver aus Manchester</h3><p class="why" style="margin-top:8px">Schreib ihm auf Englisch. Er korrigiert kurz und redet dann normal weiter.</p></div>';
  /* Nur das Ende zeichnen: bei Hunderten Nachrichten kostete jedes
     Neuzeichnen sonst spürbar Zeit, auch wenn niemand nach oben scrollt. */
  const start=Math.max(0,S.chat.length-C.show);
  if(start)h+='<button class="btn ghost" style="margin:0 0 6px" onclick="olderChat()">Ältere Nachrichten anzeigen ('+start+')</button>';
  S.chat.slice(start).forEach(m=>{
    if(m.role==="user")h+='<div class="msg me">'+esc(m.content)+'</div>';
    else{
      if(m.correction)h+='<div class="corr">'+esc(m.correction)+'</div>';
      h+='<div class="msg ol">'+esc(m.content)+' <button class="spk" style="width:30px;height:30px;font-size:14px;margin:0;vertical-align:middle" onclick="speak('+JSON.stringify(m.content).replace(/"/g,"&quot;")+')">&#128264;</button></div>';
    }
  });
  if(C.loading)h+='<p class="mono">Oliver tippt …</p>';
  if(C.err)h+='<p class="why" style="color:var(--red)">'+esc(C.err)+'</p>';

  /* Löschen sitzt direkt über dem Eingabefeld. Der Chat springt beim Öffnen
     ans Ende, oben wäre der Knopf also nie ohne Scrollen erreichbar. */
  if(S.chat.length){
    if(C.confirmClear){
      h+='<div class="card"><h3>Verlauf löschen?</h3>';
      h+='<p class="why">Alle '+S.chat.length+' Nachrichten werden entfernt. Der Kurzcode in der Sicherung enthält den Chat nicht, sie sind danach also endgültig weg. Vokabeln, Grammatik und Statistik bleiben unberührt.</p>';
      h+='<div class="row"><button class="btn ghost" onclick="C.confirmClear=false;render()">Abbrechen</button>';
      h+='<button class="btn bad" onclick="clearChat()">Löschen</button></div></div>';
    }else{
      h+='<div class="chatbar"><span class="mono">'+S.chat.length+' Nachrichten</span>';
      h+='<button class="linkbtn" onclick="C.confirmClear=true;render()">Verlauf löschen</button></div>';
    }
  }
  h+='<div style="display:flex;gap:8px;margin-top:14px">';
  if(SR)h+='<button class="x" style="width:46px;height:46px" onclick="record(chatDictated,true)">&#127908;</button>';
  h+='<input type="text" id="chatin" value="'+esc(C.draft||"")+'" placeholder="Write in English …" style="margin:0" onkeydown="if(event.key===\'Enter\')sendChat()">';
  h+='<button class="x" style="width:46px;height:46px;background:var(--amber);color:#1c1917" onclick="sendChat()">➤</button></div>';
  $("main").innerHTML=h;
  /* Im Chat interessiert immer das Ende, nicht der Anfang. Ausnahme: nach
     „Ältere anzeigen" bleibt die Stelle stehen, an der man gerade liest. */
  const m=$("main");
  if(C.keep!=null){m.scrollTop=m.scrollHeight-C.keep;C.keep=null;}
  else m.scrollTop=m.scrollHeight;
}
function olderChat(){
  const m=$("main"); C.keep=m.scrollHeight-m.scrollTop;
  C.show+=CHAT_PAGE; render();
}

/* ================= Sicherung ================= */
function openBackup(){$("exportbox").value=packState();$("keybox").value=apiKey;$("provbox").value=provider;provChanged();
  $("themebox").value=document.documentElement.getAttribute("data-theme")||"";$("backup").classList.add("show");}

/* ================= Darstellung ================= */
const darkMQ=window.matchMedia?matchMedia("(prefers-color-scheme: dark)"):null;
function setTheme(t){
  if(t)document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  try{if(t)localStorage.setItem(KEY+":theme",t);else localStorage.removeItem(KEY+":theme");}catch(e){}
  syncThemeColor();
}
/* Farbe der iOS-Statusleiste an die tatsächliche Darstellung anpassen. */
function syncThemeColor(){
  const t=document.documentElement.getAttribute("data-theme");
  const dark=t==="dark"||(!t&&darkMQ&&darkMQ.matches);
  $("themecolor").setAttribute("content",dark?"#14110f":"#f7f5f1");
}
if(darkMQ){try{darkMQ.addEventListener("change",syncThemeColor);}catch(e){darkMQ.addListener(syncThemeColor);}}
function closeBackup(){$("backup").classList.remove("show");}
function copyExport(){
  const t=packState();
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(
    ()=>{$("notice").textContent="Kurzcode kopiert.";},
    ()=>{$("notice").textContent="Kopieren ging nicht — Feld antippen und alles markieren.";});}
  else{$("notice").textContent="Feld antippen und alles markieren.";}
}
function doImport(){
  try{
    const next=unpackState($("importbox").value);
    if(!next)throw new Error("leer");
    S=Object.assign(blank(),next);
    normalise();snapshot();
    save();$("importbox").value="";closeBackup();buildRound();render();checkMedals();
  }catch(e){$("notice").textContent="Code war unvollständig — bitte komplett einfügen.";}
}
function provChanged(){
  provider=$("provbox").value;
  try{localStorage.setItem(KEY+":prov",provider);}catch(e){}
  $("keybox").placeholder=provider==="gemini"?"AQ.… oder AIza…":"sk-ant-…";
  $("keyhint").textContent=provider==="gemini"
    ?"Kostenlosen Key holen: aistudio.google.com → „Get API key“. Ohne Kreditkarte. Hinweis: Im Gratis-Tarif darf Google Eingaben zum Verbessern seiner Modelle nutzen."
    :"Key holen: console.anthropic.com → API Keys. Braucht Guthaben, kostet Centbeträge pro Nutzung.";
}
async function saveKey(){
  apiKey=$("keybox").value.trim();
  provider=$("provbox").value;
  try{localStorage.setItem(KEY+":prov",provider);}catch(e){}
  try{localStorage.setItem(KEY+":key",apiKey);}catch(e){}
  if(!apiKey){$("notice").textContent="Key entfernt.";return;}
  $("notice").textContent="Key gespeichert — teste …";
  try{
    await askClaude([{role:"user",content:"OK?"}],"Antworte nur mit OK.",10);
    $("notice").textContent="✓ Key funktioniert"+(provider==="gemini"&&gModel?" (Modell: "+gModel+")":"")+" — Chat, KI-Grammatik und neue Wörter sind frei.";
  }catch(e){$("notice").textContent="Key gespeichert, aber Test fehlgeschlagen: "+e.message;}
}

/* ================= Start ================= */
loadState();snapshot();buildRound();syncThemeColor();render();
/* Bestandsnutzer bekommen beim ersten Start alles, was sie schon verdient haben. */
checkMedals();
$("main").addEventListener("scroll",checkScroll,{passive:true});
window.addEventListener("resize",checkScroll);
if(storageOk)$("saveinfo").textContent="Automatisches Speichern aktiv";
</script>
